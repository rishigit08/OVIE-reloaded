<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ovie: Upload quote comparison flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /*
      Compare quotes intake: upload 2-4 quote documents (from phone or the
      app's My Files), then hand off to ovie_auto_quote_comparison.html.
      Tokens copied from DESIGN.md (§3 Color, §4 Typography, §6 Shape/
      Elevation, §10 Action sheets, §11 Motion) — identical to the sibling
      ovie_auto_quote_comparison.html shell, so the two screens read as one
      flow.
    */
    :root {
      --primary:#6b4062; --primary-dark:#54324d; --primary-disabled-bg:#e8dee5; --primary-disabled-text:#795972;
      --ink:#111; --text:#333a3d; --muted:#5f6368;
      --icon-default:#5f6368; --icon-strong:#111111;
      --surface:#fff; --page:#f6f6f6; --bg-subtle:#f6f6f6; --canvas:#e3e3e3; --offwhite:#fafafa;
      --success:#0d7d07; --warning:#8a5a06; --danger:#a63a33;
      --plum-soft:#f5edf3; --plum-ink:#6b4062; --plum-border:#e0cede;
      --warning-soft:#fff5df; --warning-border:#e7c982; --warning-ink:#634106;
      --success-soft:#e7fff4; --danger-soft:#ffeded;
      --border:#d8dddb; --line:#ecefed; --overlay:rgba(17,24,23,.58);
      --radius:12px; --pill:999px; --focus:0 0 0 3px rgba(107,64,98,.24);
      --motion-duration-press:160ms; --motion-duration-standard:200ms; --motion-duration-overlay:260ms;
      --motion-ease-out:cubic-bezier(.23,1,.32,1); --motion-ease-drawer:cubic-bezier(.32,.72,0,1);
      --z-sticky:20; --z-modal:40; --z-toast:60;
    }
    :root[data-theme="dark"] {
      --primary:#8a5680; --primary-dark:#6b4062; --primary-disabled-bg:#2e2531; --primary-disabled-text:#8f7488;
      --ink:#f4f2f4; --text:#d5d8da; --muted:#9aa0a6;
      --icon-default:#9aa0a6; --icon-strong:#f4f2f4;
      --surface:#1e1c20; --page:#141316; --bg-subtle:#26242a; --canvas:#000; --offwhite:#232025;
      --success:#5cc36f; --warning:#e0b25f; --danger:#e5817a;
      --plum-soft:#2c2130; --plum-ink:#dcabd2; --plum-border:#4a3548;
      --warning-soft:#2f2712; --warning-border:#5a4a1f; --warning-ink:#e7c982;
      --success-soft:#12271c; --danger-soft:#2f1a18;
      --border:#3a383f; --line:#2b2930; --overlay:rgba(0,0,0,.62);
      --focus:0 0 0 3px rgba(138,86,128,.42);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/20px "Figtree",system-ui,sans-serif}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    h1,h2,h3,p{margin:0}
    h1,h2,h3,strong{font-weight:600}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    :where(button,input,textarea,summary,a):focus-visible{outline:0;box-shadow:var(--focus)}

    .canvas{position:fixed;inset:0;display:flex;justify-content:center;overflow:auto}
    .phone{position:relative;width:min(412px,100vw);height:100dvh;min-height:640px;overflow:auto;background:var(--page);scrollbar-width:thin;scrollbar-color:var(--border) var(--page)}
    .phone::-webkit-scrollbar{width:8px}
    .phone::-webkit-scrollbar-track{background:var(--page)}
    .phone::-webkit-scrollbar-thumb{background:var(--border);border:2px solid var(--page);border-radius:var(--pill)}

    /* App bar (DESIGN §7) */
    .topbar{position:sticky;top:0;z-index:var(--z-sticky);background:var(--surface);border-bottom:1px solid var(--line)}
    .statusbar{height:34px;padding:8px 22px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600}
    .statusbar span:last-child{color:var(--muted)}
    .titlebar{min-height:58px;padding:4px 12px 10px 8px;display:flex;align-items:center;gap:8px}
    .title-group{flex:1;min-width:0}
    .title-group h1{font-size:18px;line-height:24px}
    .icon-button{width:44px;height:44px;border:0;border-radius:var(--radius);background:transparent;color:var(--icon-strong);display:grid;place-items:center;flex:0 0 auto;transition:background-color var(--motion-duration-press) ease,transform var(--motion-duration-press) var(--motion-ease-out)}
    .icon-button svg{width:22px;height:22px}
    .icon-button:active{transform:scale(.96)}
    @media(hover:hover) and (pointer:fine){.icon-button:hover{background:var(--plum-soft)}}

    main{padding:18px 16px 24px;display:flex;flex-direction:column;gap:18px}
    .intro{font-size:14px;line-height:20px;color:var(--text)}

    /* Slot list */
    .slot-list{display:flex;flex-direction:column;gap:12px}
    .slot-card{transition:transform var(--motion-duration-standard) var(--motion-ease-out),opacity var(--motion-duration-standard) var(--motion-ease-out)}
    .slot-card.slot-enter,.slot-card.slot-leave{transform:translateY(6px);opacity:0}

    .slot-empty{border:2px dashed var(--plum-ink);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;background:var(--offwhite)}
    .slot-empty.is-optional{border:1.5px dashed var(--border)}
    .slot-icon{width:48px;height:48px;border-radius:10px;background:var(--bg-subtle);display:grid;place-items:center;flex:0 0 auto;color:var(--icon-default)}
    .slot-icon svg{width:22px;height:22px}
    .slot-empty-body{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0}
    .slot-name{font-size:15px;font-weight:600}
    .slot-empty .slot-name{color:var(--muted);font-weight:600}
    .slot-sub{font-size:13px;color:var(--muted)}
    .slot-upload-btn{height:44px;padding:0 16px;border-radius:var(--pill);border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;flex:0 0 auto;transition:background-color var(--motion-duration-press) ease}
    @media(hover:hover) and (pointer:fine){.slot-upload-btn:hover{background:var(--bg-subtle)}}

    .slot-filled{border:1px solid var(--border);border-radius:14px;padding:14px 8px 14px 14px;display:flex;align-items:center;gap:14px;background:var(--surface)}
    .slot-filled .slot-icon{background:var(--plum-soft);color:var(--plum-ink)}
    .slot-filled-body{flex-grow:1;display:flex;flex-direction:column;gap:1px;min-width:0}
    .slot-eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
    .slot-filename{font-size:15px;font-weight:600;overflow-wrap:anywhere}
    .slot-source{font-size:13px;color:var(--muted)}
    .slot-remove{width:44px;height:44px;border:0;background:transparent;color:var(--ink);border-radius:var(--radius);display:grid;place-items:center;flex:0 0 auto;transition:background-color var(--motion-duration-press) ease}
    .slot-remove svg{width:20px;height:20px}
    @media(hover:hover) and (pointer:fine){.slot-remove:hover{background:var(--bg-subtle)}}

    .slot-add-more{border:1.5px dashed var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
    .slot-add-icon{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);display:grid;place-items:center;flex:0 0 auto;color:var(--icon-strong)}
    .slot-add-icon svg{width:20px;height:20px}

    .slot-max-notice{border-radius:12px;background:var(--bg-subtle);padding:12px 14px;font-size:13px;color:var(--text);line-height:18px}
    .formats-note{font-size:12px;color:var(--muted)}

    /* Sticky footer action bar */
    .action-bar{position:sticky;bottom:0;z-index:var(--z-sticky);padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:var(--page);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
    .compare-btn{width:100%;height:52px;border-radius:var(--pill);border:0;background:var(--primary-disabled-bg);color:var(--primary-disabled-text);font-size:16px;font-weight:600;transition:background-color var(--motion-duration-press) ease,color var(--motion-duration-press) ease}
    .compare-btn:not(:disabled){background:var(--primary);color:#fff;cursor:pointer}
    .compare-btn:disabled{cursor:not-allowed}
    @media(hover:hover) and (pointer:fine){.compare-btn:not(:disabled):hover{background:var(--primary-dark)}}

    /* Add-source sheet + My Files picker sheet (DESIGN §10), styled to match
       the homepage's shared upload-options bottom sheet
       (assets/ovie-upload-nav.css .upload-options-sheet). */
    .add-source-sheet,.myfiles-sheet{
      position:fixed;z-index:var(--z-modal);inset:auto 0 0;margin:0 auto;
      width:min(100%,480px);max-width:100%;max-height:calc(100dvh - 24px);padding:0;overflow:hidden;
      border:0;border-radius:12px 12px 0 0;background:var(--surface);color:var(--ink);
      box-shadow:0 6px 16px rgba(17,17,17,.12);
      transform:translateY(100%);
      transition:transform var(--motion-duration-overlay) var(--motion-ease-drawer);
      will-change:transform;
    }
    .add-source-sheet[open].is-visible,.myfiles-sheet[open].is-visible{transform:translateY(0)}
    .add-source-sheet::backdrop,.myfiles-sheet::backdrop{background:var(--overlay);opacity:0;transition:opacity var(--motion-duration-overlay) var(--motion-ease-out)}
    .add-source-sheet.is-visible::backdrop,.myfiles-sheet.is-visible::backdrop{opacity:1}
    .sheet-handle{width:40px;height:4px;margin:0 auto 12px;border-radius:999px;background:var(--border)}
    .sheet-inner{padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain}
    .sheet-header{display:flex;align-items:center;gap:8px;padding-bottom:16px}
    .sheet-header-title-group{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
    .sheet-title{font-size:18px;line-height:24px;font-weight:600}
    .sheet-subtitle{font-size:12px;line-height:16px;color:var(--muted);margin:4px 0 0}
    .sheet-close{width:44px;height:44px;border:0;background:transparent;color:var(--muted);border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
    .sheet-close svg{width:20px;height:20px}

    .source-list{display:flex;flex-direction:column}
    .source-row{width:100%;box-sizing:border-box;min-height:64px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;display:flex;align-items:center;gap:12px;padding:12px 0;text-align:left;transition:background-color var(--motion-duration-press) ease}
    .source-row:last-child{border-bottom:0}
    @media(hover:hover) and (pointer:fine){.source-row:hover{background:var(--bg-subtle)}}
    .source-icon{width:40px;height:40px;border-radius:12px;background:var(--bg-subtle);display:grid;place-items:center;flex:0 0 auto;color:var(--icon-default)}
    .source-icon svg{width:20px;height:20px}
    .source-body{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0}
    .source-name{font-size:16px;font-weight:600}
    .source-sub{font-size:13px;color:var(--muted)}

    /* My Files picker */
    .myfiles-search{height:48px;box-sizing:border-box;border:1.5px solid var(--border);border-radius:24px;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted)}
    .myfiles-search svg{width:20px;height:20px;flex:0 0 auto}
    .myfiles-search input{border:0;outline:0;background:transparent;flex-grow:1;color:var(--ink);font-size:15px}
    .myfiles-search input::placeholder{color:var(--muted)}
    .myfiles-filters{display:flex;gap:8px;margin-top:14px}
    .myfiles-chip{height:40px;padding:0 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500}
    .myfiles-chip.is-active{border-color:var(--ink);background:var(--ink);color:#fff}
    .myfiles-list{margin-top:12px;display:flex;flex-direction:column;gap:10px;max-height:38dvh;overflow:auto}
    .myfiles-row{min-height:68px;box-sizing:border-box;border:1px solid var(--border);border-radius:14px;background:var(--surface);display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
    .myfiles-row.is-selected{border:2px solid var(--primary);background:var(--plum-soft)}
    .myfiles-file-icon{width:40px;height:40px;border-radius:10px;background:var(--bg-subtle);display:grid;place-items:center;flex:0 0 auto;color:var(--icon-strong)}
    .myfiles-row.is-selected .myfiles-file-icon{background:var(--surface);color:var(--plum-ink)}
    .myfiles-file-icon svg{width:22px;height:22px}
    .myfiles-file-body{flex-grow:1;display:flex;flex-direction:column;gap:1px;min-width:0}
    .myfiles-file-name{font-size:15px;font-weight:600}
    .myfiles-file-meta{font-size:13px;color:var(--muted)}
    .myfiles-radio{width:22px;height:22px;accent-color:var(--primary);margin:0;flex:0 0 auto}
    .myfiles-footer{margin-top:6px}
    .myfiles-add-btn{width:100%;height:52px;border-radius:var(--pill);border:0;background:var(--primary-disabled-bg);color:var(--primary-disabled-text);font-size:16px;font-weight:600;transition:background-color var(--motion-duration-press) ease,color var(--motion-duration-press) ease}
    .myfiles-add-btn:not(:disabled){background:var(--primary);color:#fff;cursor:pointer}
    .myfiles-add-btn:disabled{cursor:not-allowed}
    .myfiles-footer-hint{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px}

    .toast{position:fixed;left:50%;bottom:24px;z-index:var(--z-toast);transform:translate(-50%,18px);min-width:220px;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:var(--radius);background:var(--ink);color:var(--surface);text-align:center;opacity:0;pointer-events:none;transition:opacity var(--motion-duration-standard) var(--motion-ease-out),transform var(--motion-duration-standard) var(--motion-ease-out)}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media(max-width:440px){.canvas{display:block}.phone{width:100vw}}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}
      .icon-button:active{transform:none}
      .add-source-sheet,.myfiles-sheet{transform:translateY(0);opacity:0;transition:opacity 120ms var(--motion-ease-out)!important}
      .add-source-sheet[open].is-visible,.myfiles-sheet[open].is-visible{opacity:1}
      .add-source-sheet::backdrop,.myfiles-sheet::backdrop{transition:opacity 120ms var(--motion-ease-out)!important}
      .slot-card.slot-enter,.slot-card.slot-leave{transform:none}
    }
  </style>
</head>
<body>
  <div class="canvas"><div class="phone" id="phone">
    <header class="topbar">
      <div class="statusbar"><span>9:41</span><span>5G&nbsp;&nbsp;96%</span></div>
      <div class="titlebar">
        <button class="icon-button" type="button" aria-label="Go back" onclick="history.back()">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </button>
        <div class="title-group">
          <h1>Compare quotes</h1>
        </div>
      </div>
    </header>

    <main>
      <p class="intro">Upload 2 or more quotes to compare.</p>

      <div class="slot-list" id="slotList" aria-live="polite"></div>

      <p class="formats-note">Accepted formats: PDF, JPG, PNG, DOCX</p>
    </main>

    <div class="action-bar">
      <button class="compare-btn" id="compareBtn" type="button" disabled>Compare quotes</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div></div>

  <dialog class="add-source-sheet" id="addSourceSheet" aria-labelledby="addSourceTitle">
    <div class="sheet-inner">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <div class="sheet-header-title-group">
          <h2 class="sheet-title" id="addSourceTitle">Add Quote</h2>
        </div>
        <button class="sheet-close" id="closeAddSource" type="button" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <p class="sheet-subtitle">Choose where the quote document is</p>
      <div class="source-list">
        <button class="source-row" type="button" id="sourcePhone">
          <span class="source-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg></span>
          <span class="source-body"><span class="source-name">From phone</span><span class="source-sub">Browse Files or Photos on this device</span></span>
        </button>
        <button class="source-row" type="button" id="sourceMyFiles">
          <span class="source-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></span>
          <span class="source-body"><span class="source-name">From My Files</span><span class="source-sub">Documents already saved in Ovie</span></span>
        </button>
      </div>
    </div>
  </dialog>

  <input id="phoneFileInput" type="file" accept=".pdf,.png,.jpg,.jpeg,.docx" hidden>

  <dialog class="myfiles-sheet" id="myfilesSheet" aria-labelledby="myfilesTitle">
    <div class="sheet-inner">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <button class="sheet-close" id="backToAddSource" type="button" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <div class="sheet-header-title-group">
          <h2 class="sheet-title" id="myfilesTitle">My Files</h2>
        </div>
        <button class="sheet-close" id="closeMyFiles" type="button" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="myfiles-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>
        <input aria-label="Search files" placeholder="Search files">
      </div>
      <div class="myfiles-filters">
        <button class="myfiles-chip" type="button">All</button>
        <button class="myfiles-chip is-active" type="button">Quotes</button>
        <button class="myfiles-chip" type="button">Policies</button>
      </div>
      <div class="myfiles-list" id="myfilesList" role="radiogroup" aria-label="Select a file"></div>
      <div class="myfiles-footer">
        <p class="myfiles-footer-hint" id="myfilesHint">No file selected</p>
        <button class="myfiles-add-btn" id="myfilesAddBtn" type="button" disabled>Add as Quote</button>
      </div>
    </div>
  </dialog>

  <script>
    (function () {
      'use strict';
      var MAX_SLOTS = 4;
      var MIN_REQUIRED = 2;
      var MYFILES_SEED = [
        { id: 'a', name: 'Quote_A.pdf', meta: 'PDF · Uploaded Sep 12' },
        { id: 'b', name: 'Quote_B.pdf', meta: 'PDF · Uploaded Sep 18' },
        { id: 'c', name: 'Quote_C.docx', meta: 'DOCX · Uploaded Sep 20' },
        { id: 'd', name: 'Quote_D.jpg', meta: 'JPG · Uploaded Sep 24' }
      ];

      var slots = [];
      var seenIds = Object.create(null);
      var nextId = 1;
      var pendingSlotIndex = null;
      var myFilesSelectedId = null;

      var slotList = document.getElementById('slotList');
      var compareBtn = document.getElementById('compareBtn');
      var toast = document.getElementById('toast');
      var toastTimer;

      var docIcon = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg>';
      var uploadIcon = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>';
      var plusIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      var closeIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
      }

      function requiredSlotCount() {
        return Math.max(MIN_REQUIRED, Math.min(slots.length + 1, MAX_SLOTS));
      }

      function render() {
        // Slot list: filled rows, then remaining empty/add-more state
        var html = '';
        slots.forEach(function (slot, index) {
          html += filledSlotHtml(slot, index);
        });

        if (slots.length < MIN_REQUIRED) {
          for (var i = slots.length; i < MIN_REQUIRED; i++) {
            html += emptySlotHtml(i, false);
          }
        } else if (slots.length < MAX_SLOTS) {
          html += addMoreHtml(slots.length);
        } else {
          html += '<div class="slot-max-notice">Maximum of 4 quotes reached. Remove one to add a different quote.</div>';
        }

        slotList.innerHTML = html;

        slotList.querySelectorAll('[data-upload-slot]').forEach(function (button) {
          button.addEventListener('click', function () {
            openAddSource(Number(button.dataset.uploadSlot));
          });
        });
        slotList.querySelectorAll('[data-remove-slot]').forEach(function (button) {
          button.addEventListener('click', function () {
            removeSlot(Number(button.dataset.removeSlot));
          });
        });
        slotList.querySelectorAll('[data-add-more]').forEach(function (button) {
          button.addEventListener('click', function () {
            openAddSource(slots.length);
          });
        });

        animateFreshCards();

        // Footer
        compareBtn.disabled = slots.length < MIN_REQUIRED;
        compareBtn.textContent = slots.length < MIN_REQUIRED ? 'Compare quotes' : 'Compare ' + slots.length + ' quotes';
      }

      function filledSlotHtml(slot, index) {
        return '' +
          '<div class="slot-card slot-filled" data-slot-card data-fresh-id="' + slot.id + '">' +
            '<span class="slot-icon" aria-hidden="true">' + docIcon + '</span>' +
            '<div class="slot-filled-body">' +
              '<span class="slot-eyebrow">QUOTE ' + (index + 1) + '</span>' +
              '<span class="slot-filename">' + escapeHtml(slot.name) + '</span>' +
              '<span class="slot-source">' + escapeHtml(slot.source) + '</span>' +
            '</div>' +
            '<button class="slot-remove" type="button" data-remove-slot="' + index + '" aria-label="Remove Quote ' + (index + 1) + '">' + closeIcon + '</button>' +
          '</div>';
      }

      function emptySlotHtml(index, optional) {
        return '' +
          '<div class="slot-card ' + (optional ? 'slot-empty is-optional' : 'slot-empty') + '" data-slot-card>' +
            '<span class="slot-icon" aria-hidden="true">' + uploadIcon + '</span>' +
            '<div class="slot-empty-body">' +
              '<span class="slot-name">Quote ' + (index + 1) + '</span>' +
            '</div>' +
            '<button class="slot-upload-btn" type="button" data-upload-slot="' + index + '">Upload</button>' +
          '</div>';
      }

      function addMoreHtml(currentCount) {
        var remaining = MAX_SLOTS - currentCount;
        return '' +
          '<div class="slot-card slot-add-more" data-slot-card>' +
            '<span class="slot-add-icon" aria-hidden="true">' + plusIcon + '</span>' +
            '<div class="slot-empty-body">' +
              '<span class="slot-name">Add another quote</span>' +
              '<span class="slot-sub">Optional · up to ' + remaining + ' more</span>' +
            '</div>' +
            '<button class="slot-upload-btn" type="button" data-add-more>Upload</button>' +
          '</div>';
      }

      function escapeHtml(value) {
        var div = document.createElement('div');
        div.textContent = value;
        return div.innerHTML;
      }

      function animateFreshCards() {
        slotList.querySelectorAll('[data-fresh-id]').forEach(function (card) {
          var id = card.dataset.freshId;
          if (seenIds[id]) return;
          seenIds[id] = true;
          card.classList.add('slot-enter');
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { card.classList.remove('slot-enter'); });
          });
        });
      }

      function addSlot(name, source) {
        if (slots.length >= MAX_SLOTS) return;
        slots.push({ id: 'slot-' + (nextId++), name: name, source: source });
        render();
      }

      function removeSlot(index) {
        var card = slotList.querySelectorAll('[data-slot-card]')[index];
        var id = slots[index] && slots[index].id;
        if (!card) { slots.splice(index, 1); render(); return; }
        card.classList.add('slot-leave');
        var finish = function () {
          slots.splice(index, 1);
          if (id) delete seenIds[id];
          render();
        };
        var done = false;
        var onEnd = function () { if (done) return; done = true; finish(); };
        card.addEventListener('transitionend', onEnd, { once: true });
        setTimeout(onEnd, 260);
      }

      // Add-source sheet
      var addSourceSheet = document.getElementById('addSourceSheet');
      var addSourceTitle = document.getElementById('addSourceTitle');
      var sourcePhoneBtn = document.getElementById('sourcePhone');
      var sourceMyFilesBtn = document.getElementById('sourceMyFiles');
      var closeAddSourceBtn = document.getElementById('closeAddSource');
      var phoneFileInput = document.getElementById('phoneFileInput');
      var openerElement = null;
      var allSheets = [];

      function transitionDuration(sheet) {
        return matchMedia('(prefers-reduced-motion:reduce)').matches ? 120 : 260;
      }

      function anySheetOpen() {
        return allSheets.some(function (sheet) { return sheet.open; });
      }

      function openSheet(sheet, opener) {
        clearTimeout(sheet._closeTimer);
        openerElement = opener;
        sheet.classList.remove('is-visible');
        sheet.showModal();
        document.body.classList.add('sheet-open');
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { sheet.classList.add('is-visible'); });
        });
      }

      function closeSheet(sheet, returnFocus) {
        if (!sheet.open) return;
        sheet.classList.remove('is-visible');
        clearTimeout(sheet._closeTimer);
        sheet._closeTimer = setTimeout(function () {
          sheet.close();
          if (!anySheetOpen()) document.body.classList.remove('sheet-open');
          if (returnFocus !== false && openerElement) openerElement.focus({ preventScroll: true });
        }, transitionDuration(sheet) + 34);
      }

      function openAddSource(slotIndex) {
        pendingSlotIndex = slotIndex;
        addSourceTitle.textContent = 'Add Quote ' + (slotIndex + 1);
        openSheet(addSourceSheet, document.activeElement);
      }

      closeAddSourceBtn.addEventListener('click', function () { closeSheet(addSourceSheet); });
      addSourceSheet.addEventListener('cancel', function (event) { event.preventDefault(); closeSheet(addSourceSheet); });
      addSourceSheet.addEventListener('pointerdown', function (event) {
        var bounds = addSourceSheet.getBoundingClientRect();
        var outside = event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom;
        if (outside) closeSheet(addSourceSheet);
      });

      sourcePhoneBtn.addEventListener('click', function () {
        phoneFileInput.value = '';
        phoneFileInput.click();
      });
      phoneFileInput.addEventListener('change', function () {
        if (!phoneFileInput.files.length) return;
        var name = phoneFileInput.files[0].name;
        closeSheet(addSourceSheet, false);
        addSlot(name, 'From phone');
      });

      sourceMyFilesBtn.addEventListener('click', function () {
        closeSheet(addSourceSheet, false);
        openMyFiles();
      });

      // My Files picker sheet
      var myfilesSheet = document.getElementById('myfilesSheet');
      var myfilesList = document.getElementById('myfilesList');
      var myfilesAddBtn = document.getElementById('myfilesAddBtn');
      var myfilesHint = document.getElementById('myfilesHint');
      var closeMyFilesBtn = document.getElementById('closeMyFiles');
      var backToAddSourceBtn = document.getElementById('backToAddSource');
      allSheets = [addSourceSheet, myfilesSheet];

      function renderMyFilesList() {
        myfilesList.innerHTML = MYFILES_SEED.map(function (file) {
          var selected = file.id === myFilesSelectedId;
          return '' +
            '<label class="myfiles-row' + (selected ? ' is-selected' : '') + '">' +
              '<span class="myfiles-file-icon" aria-hidden="true">' + docIcon + '</span>' +
              '<span class="myfiles-file-body">' +
                '<span class="myfiles-file-name">' + escapeHtml(file.name) + '</span>' +
                '<span class="myfiles-file-meta">' + escapeHtml(file.meta) + '</span>' +
              '</span>' +
              '<input class="myfiles-radio" type="radio" name="myfiles-pick" data-file-id="' + file.id + '"' + (selected ? ' checked' : '') + ' aria-label="Select ' + escapeHtml(file.name) + '">' +
            '</label>';
        }).join('');
        myfilesList.querySelectorAll('input[type="radio"]').forEach(function (input) {
          input.addEventListener('change', function () {
            myFilesSelectedId = input.dataset.fileId;
            renderMyFilesList();
            updateMyFilesFooter();
          });
        });
      }

      function updateMyFilesFooter() {
        var selectedFile = MYFILES_SEED.find(function (f) { return f.id === myFilesSelectedId; });
        myfilesHint.textContent = selectedFile ? '1 file selected' : 'No file selected';
        myfilesAddBtn.disabled = !selectedFile;
        myfilesAddBtn.textContent = pendingSlotIndex === null ? 'Add as Quote' : 'Add as Quote ' + (pendingSlotIndex + 1);
      }

      function openMyFiles() {
        myFilesSelectedId = null;
        renderMyFilesList();
        updateMyFilesFooter();
        openSheet(myfilesSheet, document.activeElement);
      }

      closeMyFilesBtn.addEventListener('click', function () { closeSheet(myfilesSheet); });
      backToAddSourceBtn.addEventListener('click', function () {
        closeSheet(myfilesSheet, false);
        openAddSource(pendingSlotIndex);
      });
      myfilesSheet.addEventListener('cancel', function (event) { event.preventDefault(); closeSheet(myfilesSheet); });
      myfilesSheet.addEventListener('pointerdown', function (event) {
        var bounds = myfilesSheet.getBoundingClientRect();
        var outside = event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom;
        if (outside) closeSheet(myfilesSheet);
      });
      myfilesAddBtn.addEventListener('click', function () {
        var selectedFile = MYFILES_SEED.find(function (f) { return f.id === myFilesSelectedId; });
        if (!selectedFile) return;
        closeSheet(myfilesSheet, false);
        addSlot(selectedFile.name, 'From My Files');
      });

      compareBtn.addEventListener('click', function () {
        if (compareBtn.disabled) return;
        location.href = 'ovie_auto_quote_comparison.html';
      });

      render();
    })();
  </script>
</body>
</html>
