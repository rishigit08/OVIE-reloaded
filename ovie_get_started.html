<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#6b4062">
  <title>Ovie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b4062;
      --primary-dark: #54324d;
      --primary-soft: #f5edf3;
      --ai-gradient-start: #bd4ba5;
      --ai-gradient-end: #5c2e8b;
      --ink: #111111;
      --copy: #333a3d;
      --muted: #5f6368;
      --surface: #ffffff;
      --icon-inverse: #ffffff;
      --bg-canvas: #f6f6f6;
      --border: #d8dddb;
      --border-soft: #ecefed;
      --focus: #6b4062;
      --radius: 12px;
      --motion-duration-press: 160ms;
      --motion-duration-standard: 200ms;
      --motion-duration-overlay: 260ms;
      --motion-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --motion-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --motion-ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100dvh;
      background: var(--prototype-backdrop, #e3e3e3);
      color: var(--ink);
      font-family: Figtree, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }

    @media (max-width: 480px) {
      html, body { background: var(--primary-soft); }
    }

    .app-shell {
      position: relative;
      width: min(100%, 480px);
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--primary-soft);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 481px) {
      .app-shell { border-inline: 1px solid #d2d2d2; }
    }

    /* ---------- Hero sheet: white sheet carrying the logo, illustration + value prop ---------- */
    .hero {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: calc(env(safe-area-inset-top) + 14.56px) 19px 18.2px;
      color: var(--primary);
    }

    .hero > * { position: relative; z-index: 1; }

    /* Hero actors — a plain Figtree "ovie" wordmark in neutral grey, sized to a quiet 26px
       so it reads as a label above the value prop rather than a competing title. */
    .wordmark {
      display: block;
      height: 26px;
      /* Alpha on the color rather than element opacity, which the reveal transition animates. */
      color: rgba(95, 99, 104, 0.55);
    }

    /* Illustration: assets/ovie-get-started-illustration.webp (transparent background). */
    .illustration {
      display: block;
      width: clamp(176px, 56%, 236px);
      height: auto;
    }

    .headline {
      margin: 0;
      /* 15ch was sized for a single 32px size; the accent line is wider than 15ch of the 24px first line. */
      max-width: 100%;
      font-size: 24px;
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--ink);
    }
    /* Scoped exception vs DESIGN.md §3 (AI gradient reserved for Ask Ovie): per product direction,
       the headline accent uses the pink→purple gradient as a one-time onboarding focal moment. */
    .headline .accent {
      /* Accent phrase is 28px/32px; the first line above is 24px/28px. */
      font-size: 28px;
      line-height: 32px;
      background: linear-gradient(90deg, var(--ai-gradient-start), var(--ai-gradient-end));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    /* ---------- Auth sheet (bottom): the CTAs live on a white rounded sheet docked to the
       bottom edge, mirroring the Luma pattern. The hero actors sit on the plain canvas above. */
    .auth-panel {
      width: 100%;
      color: var(--ink);
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -6px 16px rgba(17, 17, 17, 0.12);
      padding: 20px 16px calc(18px + env(safe-area-inset-bottom));
    }

    .auth-subtitle {
      margin: 0 0 16px;
      font-size: 12px;
      line-height: 16px;
      text-align: center;
      color: var(--muted);
    }

    .primary-action,
    .secondary-action {
      width: 100%;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: var(--radius);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition:
        background-color var(--motion-duration-standard) var(--motion-ease-out),
        transform var(--motion-duration-press) var(--motion-ease-out);
    }

    .primary-action { border: 0; background: var(--primary); color: #fff; }
    .secondary-action {
      margin-top: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
    }

    /* Compact icon-only SSO row. Extra top space separates it from the email/phone CTAs so
       the SSO options read as an alternative set rather than a continuation of the stack. */
    .sso-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .sso-icon {
      flex: 1;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition:
        background-color var(--motion-duration-standard) var(--motion-ease-out),
        border-color var(--motion-duration-standard) var(--motion-ease-out),
        transform var(--motion-duration-press) var(--motion-ease-out);
    }
    .sso-icon svg { width: 20px; height: 20px; flex: 0 0 auto; }

    .primary-action:active,
    .secondary-action:active,
    .sso-icon:active { transform: scale(0.98); }

    @media (hover: hover) and (pointer: fine) {
      .primary-action:hover { background: var(--primary-dark); }
      .secondary-action:hover,
      .sso-icon:hover { background: var(--primary-soft); border-color: var(--primary-soft); }
    }

    .terms {
      margin: 16px 0 0;
      text-align: center;
      font-size: 12px;
      line-height: 16px;
      color: var(--muted);
    }
    .terms a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    .terms a:hover { text-decoration: underline; }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 58%, white);
      outline-offset: 3px;
    }
    .auth-panel :focus-visible { outline-offset: 2px; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Splash overlay (step 1 of the one-time intro) ---------- */
    /* Plum full-cover layer with the Ovie logo in white. After the dwell the logo grows until
       it nearly fills the screen width (phase 1, .is-growing), then the whole layer fades away
       (phase 2, .is-fading) to uncover the Get Started screen as its reveal begins. Sits above
       everything, including the hero. */
    .splash {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      transition: opacity var(--motion-duration-overlay) var(--motion-ease-out);
    }
    .splash.is-fading {
      opacity: 0;
      pointer-events: none;
    }
    .splash-brand {
      opacity: 1;
      transform: scale(1);
      transition:
        opacity var(--motion-duration-overlay) var(--motion-ease-out),
        transform var(--motion-duration-overlay) var(--motion-ease-out);
    }
    @starting-style {
      .splash-brand { opacity: 0; transform: scale(0.96); }
    }
    /* Phase 1: on-screen scale, so ease-in-out. --splash-scale is measured in JS so the logo
       ends at ~90% of the shell width on any device. */
    .splash-brand.is-growing {
      transform: scale(var(--splash-scale, 3.5));
      transition: transform 520ms var(--motion-ease-in-out);
    }
    .splash-logo {
      display: block;
      width: 96px;
      height: auto;
      color: var(--icon-inverse);
    }

    /* ---------- Motion: Get Started reveal (step 2 of the one-time intro) ---------- */
    /* The reveal is held off until the splash lifts: default = "closed" (sheet below the
       viewport; hero actors nudged down and invisible), .is-revealed on the shell = "open".
       A refresh starts here. */
    .auth-panel {
      /* From state: parked below the viewport. Drawer-type motion with iOS-like curve. */
      transform: translateY(100%);
      transition: transform 460ms var(--motion-ease-drawer);
    }
    .is-revealed .auth-panel {
      transform: translateY(0);
    }

    .wordmark,
    .illustration,
    .headline {
      /* From state: nudged 16px down + invisible. On reveal they rise upward into place. */
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity var(--motion-duration-overlay) var(--motion-ease-out),
        transform var(--motion-duration-overlay) var(--motion-ease-out);
    }
    .is-revealed .wordmark,
    .is-revealed .illustration,
    .is-revealed .headline {
      opacity: 1;
      transform: translateY(0);
    }
    /* Stagger top to bottom: wordmark, illustration, headline. */
    .is-revealed .wordmark     { transition-delay: 60ms; }
    .is-revealed .illustration { transition-delay: 120ms; }
    .is-revealed .headline     { transition-delay: 180ms; }

    @media (prefers-reduced-motion: reduce) {
      .splash,
      .splash-brand,
      .wordmark,
      .illustration,
      .headline,
      .auth-panel {
        transition: opacity var(--motion-duration-standard) var(--motion-ease-out);
        transition-delay: 0ms;
      }
      .splash-brand.is-growing { transform: none; }
      .auth-panel,
      .is-revealed .auth-panel { transform: none; }
      .wordmark,
      .illustration,
      .headline { transform: none; }
      .splash.is-fading { transition-duration: var(--motion-duration-standard); }
      @starting-style {
        .splash-brand { transform: none; }
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">

        </svg>
      </div>
    </div>

    <section class="hero">
      <h1 class="visually-hidden">Ovie — every policy, clearly explained</h1>

      <svg class="wordmark" viewBox="0 0 148 56" role="img" aria-label="Ovie" fill="currentColor">
        <text x="74" y="44" text-anchor="middle" font-family="Figtree, system-ui, sans-serif" font-size="56" font-weight="600" letter-spacing="-1.5">ovie</text>
      </svg>

      <img class="illustration" src="assets/ovie-get-started-illustration.webp" alt="A purple folder holding colorful policy documents" width="1027" height="1024" decoding="async">

      <h2 class="headline">Every policy,<br><span class="accent">clearly explained</span></h2>
    </section>

    <section class="auth-panel" aria-label="Sign in or create an account">
      <p class="auth-subtitle">Everything you're insured for, kept safe and explained simply.</p>

      <button class="secondary-action" type="button" data-next="ovie_get_started_email.html">Continue with email</button>

  </main>

  <script>
    // Drives the one-time onboarding intro: splash dwell → splash exit → reveal.
    // Refreshing the page replays the whole sequence from the splash.
    (function () {
      var shell = document.querySelector('.app-shell');
      var splash = document.getElementById('splash');
      var brand = document.getElementById('splashBrand');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Timeline (ms after load):
      //   DWELL            logo rests, centered
      //   DWELL..+FADE_AT  logo grows to ~90% of the shell width (520ms ease-in-out)
      //   DWELL+FADE_AT    plum layer fades (260ms) and the Get Started reveal starts underneath
      //   ...+FADE         splash is removed so it can never trap focus
      var DWELL = reduce ? 300 : 1200;
      var FADE_AT = reduce ? 0 : 380;   // overlaps the tail of the growth so there is no dead beat
      var FADE = reduce ? 200 : 260;

      // Layout width from computed style: unlike getBoundingClientRect it ignores the entrance scale.
      var logoWidth = parseFloat(getComputedStyle(brand.firstElementChild).width) || 96;
      splash.style.setProperty('--splash-scale', ((shell.clientWidth * 0.9) / logoWidth).toFixed(3));

      window.setTimeout(function () {
        if (!reduce) brand.classList.add('is-growing');
        window.setTimeout(function () {
          splash.classList.add('is-fading');
          shell.classList.add('is-revealed');
          window.setTimeout(function () { splash.remove(); }, FADE + 40);
        }, FADE_AT);
      }, DWELL);
    })();

    // Prototype routing: the email / phone / SSO entry screens are follow-ups and
    // don't exist yet. Each control records its intended destination in data-next so
    // it's trivial to wire later — flip this handler to `location.href = next` once the
    // target page lands. For now we log the intent so the flow stays inspectable (no 404s).
    document.querySelectorAll('[data-next]').forEach((el) => {
      el.addEventListener('click', (event) => {
        event.preventDefault();
        console.info('[get-started] intended next step:', el.dataset.next);
      });
    });
  </script>
</body>
