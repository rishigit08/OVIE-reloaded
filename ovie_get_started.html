<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>Get started | Ovie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b4062;
      --primary-dark: #54324d;
      --primary-soft: #f5edf3;
      --ai-gradient-start: #bd4ba5;
      --ai-gradient-end: #5c2e8b;
      --ink: #111111;
      --copy: #333a3d;
      --muted: #5f6368;
      --surface: #ffffff;
      --icon-inverse: #ffffff;
      --bg-canvas: #f6f6f6;
      --border: #d8dddb;
      --border-soft: #ecefed;
      --focus: #6b4062;
      --radius: 12px;
      --motion-duration-press: 160ms;
      --motion-duration-standard: 200ms;
      --motion-duration-overlay: 260ms;
      --motion-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --motion-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --motion-ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100dvh;
      background: var(--prototype-backdrop, #e3e3e3);
      color: var(--ink);
      font-family: Figtree, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }

    @media (max-width: 480px) {
      html, body { background: var(--bg-canvas); }
    }

    .app-shell {
      position: relative;
      width: min(100%, 480px);
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 481px) {
      .app-shell { border-inline: 1px solid #d2d2d2; }
    }

    /* ---------- Hero sheet: white sheet carrying the logo, illustration + value prop ---------- */
    .hero {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: calc(env(safe-area-inset-top) + 32px) 24px 32px;
      color: var(--primary);
    }

    .hero > * { position: relative; z-index: 1; }

    /* The white sheet itself. It is as tall as the shell so the intro can start full-screen
       and retract upward to the hero's height (--hero-h / --shell-h are measured in JS). */
    .hero::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      right: 0;
      height: var(--shell-h, 100%);
      background: var(--surface);
      border-radius: 0 0 24px 24px;
      box-shadow: 0 6px 16px rgba(17, 17, 17, 0.12);
      transform: translateY(calc(var(--hero-h, 0px) - var(--shell-h, 0px)));
    }

    /* Decorative handle at the sheet's bottom edge, as in the reference. */
    .hero::after {
      content: "";
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 8px;
      width: 36px;
      height: 4px;
      margin-left: -18px;
      border-radius: 999px;
      background: var(--border);
    }

    /* Hero actors — a plain Figtree "ovie" wordmark in neutral grey, sized to a quiet 26px
       so it reads as a label above the value prop rather than a competing title. */
    .wordmark {
      display: block;
      height: 26px;
      color: var(--muted);
    }

    /* Illustration slot: replace the contents of .illustration with the final brand artwork.
       Keep strokes/fills on currentColor so it stays legible on plum. */
    .illustration {
      display: block;
      width: clamp(176px, 56%, 236px);
      height: auto;
      color: var(--primary);
    }

    .headline {
      margin: 0;
      max-width: 15ch;
      font-size: 32px;
      line-height: 36px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--ink);
    }
    /* Scoped exception vs DESIGN.md §3 (AI gradient reserved for Ask Ovie): per product direction,
       the headline accent uses the pink→purple gradient as a one-time onboarding focal moment. */
    .headline .accent {
      background: linear-gradient(90deg, var(--ai-gradient-start), var(--ai-gradient-end));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    /* ---------- Auth actions (on the canvas below the sheet, visible on load) ---------- */
    .auth-panel {
      width: 100%;
      color: var(--ink);
      padding: 20px 16px calc(18px + env(safe-area-inset-bottom));
    }

    .auth-subtitle {
      margin: 0 0 16px;
      font-size: 12px;
      line-height: 16px;
      text-align: center;
      color: var(--muted);
    }

    .primary-action,
    .secondary-action {
      width: 100%;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: var(--radius);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition:
        background-color var(--motion-duration-standard) var(--motion-ease-out),
        transform var(--motion-duration-press) var(--motion-ease-out);
    }

    .primary-action { border: 0; background: var(--primary); color: #fff; }
    .secondary-action {
      margin-top: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
    }

    /* Compact icon-only SSO row. Extra top space separates it from the email/phone CTAs so
       the SSO options read as an alternative set rather than a continuation of the stack. */
    .sso-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .sso-icon {
      flex: 1;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition:
        background-color var(--motion-duration-standard) var(--motion-ease-out),
        border-color var(--motion-duration-standard) var(--motion-ease-out),
        transform var(--motion-duration-press) var(--motion-ease-out);
    }
    .sso-icon svg { width: 20px; height: 20px; flex: 0 0 auto; }

    .primary-action:active,
    .secondary-action:active,
    .sso-icon:active { transform: scale(0.98); }

    @media (hover: hover) and (pointer: fine) {
      .primary-action:hover { background: var(--primary-dark); }
      .secondary-action:hover,
      .sso-icon:hover { background: var(--primary-soft); border-color: var(--primary-soft); }
    }

    .terms {
      margin: 16px 0 0;
      text-align: center;
      font-size: 12px;
      line-height: 16px;
      color: var(--muted);
    }
    .terms a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    .terms a:hover { text-decoration: underline; }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 58%, white);
      outline-offset: 3px;
    }
    .auth-panel :focus-visible { outline-offset: 2px; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Motion: one-time intro ---------- */
    /* The white sheet starts filling the shell and retracts to the hero's resting height;
       the wordmark, illustration, headline and auth actions fade and rise 8px in staggered
       after it. One-time only; no looping, no parallax. @starting-style drives everything
       so the browser schedules the transitions off the main thread while the page loads. */
    .hero::before {
      /* Drawer-type motion: slightly longer than UI standard, iOS-like curve. */
      transition: transform 420ms var(--motion-ease-drawer);
    }
    .hero::after,
    .wordmark,
    .illustration,
    .headline,
    .auth-panel {
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity var(--motion-duration-overlay) var(--motion-ease-out),
        transform var(--motion-duration-overlay) var(--motion-ease-out);
    }
    /* Stagger: the "ovie" wordmark leads so it picks up where the splash logo left off;
       illustration, headline, drag handle and the grey auth block follow in 60ms steps. */
    .wordmark     { transition-delay: 220ms; }
    .illustration { transition-delay: 280ms; }
    .headline     { transition-delay: 340ms; }
    .hero::after  { transition-delay: 360ms; }
    .auth-panel   { transition-delay: 400ms; }

    @starting-style {
      /* Sheet starts with no translate so it covers the whole shell; its resting transform
         (set above on .hero::before) pulls it up to just the hero area. */
      .hero::before { transform: none; }
      .wordmark,
      .illustration,
      .headline,
      .hero::after,
      .auth-panel { opacity: 0; transform: translateY(8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero::before,
      .hero::after,
      .wordmark,
      .illustration,
      .headline,
      .auth-panel {
        transition: opacity var(--motion-duration-standard) var(--motion-ease-out);
        transition-delay: 0ms;
      }
      @starting-style {
        .hero::before { transform: translateY(calc(var(--hero-h, 0px) - var(--shell-h, 0px))); }
        .hero::after,
        .wordmark,
        .illustration,
        .headline,
        .auth-panel { opacity: 0; transform: none; }
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <h1 class="visually-hidden">Ovie — every policy, clearly explained</h1>

      <svg class="wordmark" viewBox="0 0 148 56" role="img" aria-label="Ovie" fill="currentColor">
        <text x="74" y="44" text-anchor="middle" font-family="Figtree, system-ui, sans-serif" font-size="56" font-weight="600" letter-spacing="-1.5">ovie</text>
      </svg>

      <!-- Illustration placeholder — swap this <svg> for the final artwork (keep currentColor). -->
      <svg class="illustration" viewBox="0 0 240 200" role="img" aria-label="Illustration of a policy document" fill="none">
        <rect x="64" y="36" width="112" height="140" rx="12" fill="var(--primary-soft)" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.9"/>
        <line x1="84" y1="68" x2="156" y2="68" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75"/>
        <line x1="84" y1="88" x2="156" y2="88" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.55"/>
        <line x1="84" y1="108" x2="132" y2="108" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
        <circle cx="150" cy="140" r="26" fill="var(--primary)" stroke="var(--primary)" stroke-width="2.5"/>
        <path d="M139 140.5l7.5 7.5 15-15.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <h2 class="headline">Every policy,<br><span class="accent">clearly explained</span></h2>
    </section>

    <section class="auth-panel" aria-label="Sign in or create an account">
      <p class="auth-subtitle">Discover and understand your insurance, all in one place.</p>

      <button class="primary-action" type="button" data-next="ovie_get_started_phone.html">Continue with phone</button>
      <button class="secondary-action" type="button" data-next="ovie_get_started_email.html">Continue with email</button>

      <div class="sso-row">
        <button class="sso-icon" type="button" data-next="sso-apple" aria-label="Continue with Apple">
          <svg viewBox="4.525 3.64 16.06 16.06" fill="currentColor" aria-hidden="true"><path d="M17.05 12.04c-.02-2.07 1.69-3.06 1.77-3.11-.97-1.41-2.47-1.61-3-1.63-1.27-.13-2.49.75-3.13.75-.65 0-1.64-.73-2.7-.71-1.39.02-2.67.81-3.38 2.05-1.44 2.5-.37 6.2 1.03 8.23.69 1 1.5 2.12 2.57 2.08 1.03-.04 1.42-.67 2.67-.67 1.24 0 1.6.67 2.69.65 1.11-.02 1.81-1.02 2.49-2.02.78-1.15 1.1-2.27 1.12-2.33-.02-.01-2.15-.83-2.17-3.27Zm-2.05-5.79c.57-.69.95-1.65.85-2.61-.82.03-1.81.54-2.4 1.23-.53.61-.99 1.59-.87 2.53.91.07 1.85-.46 2.42-1.15Z"/></svg>
        </button>
        <button class="sso-icon" type="button" data-next="sso-google" aria-label="Continue with Google">
          <svg viewBox="-0.24 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.52 12.27c0-.86-.08-1.7-.22-2.5H12v4.73h6.46c-.28 1.5-1.12 2.77-2.39 3.62v3.01h3.87c2.26-2.09 3.58-5.17 3.58-8.86Z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.9l-3.87-3.01c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.28v3.11C3.25 21.3 7.31 24 12 24Z"/>
            <path fill="#FBBC05" d="M5.27 14.28c-.24-.72-.38-1.49-.38-2.28s.14-1.56.38-2.28V6.61H1.28A11.99 11.99 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39l3.99-3.11Z"/>
            <path fill="#EA4335" d="M12 4.76c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.23 0 12 0 7.31 0 3.25 2.7 1.28 6.61l3.99 3.11C6.22 6.87 8.87 4.76 12 4.76Z"/>
          </svg>
        </button>
        <button class="sso-icon" type="button" data-next="sso-microsoft" aria-label="Continue with Microsoft">
          <svg viewBox="3 3 18 18" aria-hidden="true">
            <path fill="#F25022" d="M3 3h8.5v8.5H3z"/>
            <path fill="#7FBA00" d="M12.5 3H21v8.5h-8.5z"/>
            <path fill="#00A4EF" d="M3 12.5h8.5V21H3z"/>
            <path fill="#FFB900" d="M12.5 12.5H21V21h-8.5z"/>
          </svg>
        </button>
      </div>

      <p class="terms">By continuing, you agree to Ovie's <a href="#" data-next="terms">Terms of Use</a> and <a href="#" data-next="privacy">Privacy Policy</a>.</p>
    </section>
  </main>

  <script>
    // Expose the shell's and hero's measured heights so the sheet's resting transform
    // (translateY of hero_h - shell_h) is exact at this device size. Also recompute when
    // the hero reflows (font load, device rotation, resize observer).
    (function () {
      var root = document.documentElement;
      var shell = document.querySelector('.app-shell');
      var hero = document.querySelector('.hero');
      function measure() {
        root.style.setProperty('--shell-h', shell.offsetHeight + 'px');
        root.style.setProperty('--hero-h', hero.offsetHeight + 'px');
      }
      measure();
      if (window.ResizeObserver) new ResizeObserver(measure).observe(hero);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    })();

    // Prototype routing: the email / phone / SSO entry screens are follow-ups and
    // don't exist yet. Each control records its intended destination in data-next so
    // it's trivial to wire later — flip this handler to `location.href = next` once the
    // target page lands. For now we log the intent so the flow stays inspectable (no 404s).
    document.querySelectorAll('[data-next]').forEach((el) => {
      el.addEventListener('click', (event) => {
        event.preventDefault();
        console.info('[get-started] intended next step:', el.dataset.next);
      });
    });
  </script>
</body>
</html>
