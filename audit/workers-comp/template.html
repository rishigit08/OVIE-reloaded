    .ask-composer-action .composer-send-icon { display: none; }

    .ask-composer-action.is-send .composer-send-icon { display: block; }
    .ask-ovie-disclaimer { margin: 8px 8px 0; color: var(--muted); font-size: 12px; line-height: 16px; text-align: center; }
    .ask-sheet.keyboard-visible .ask-ovie-disclaimer, .ask-sheet.show-android-keyboard-preview .ask-ovie-disclaimer { display: none; }
    .android-keyboard-preview { display: none; margin: 14px -16px -18px; padding: 0 5px calc(7px + env(safe-area-inset-bottom)); background: #eef0f3; color: #202124; font-family: Roboto, system-ui, sans-serif; font-size: 13px; line-height: 16px; font-weight: 500; user-select: none; }
    .android-suggestions { min-height: 38px; margin-inline: -5px; padding-inline: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; border-bottom: 1px solid #d5d8dc; background: #f8f9fa; }
    .android-suggestion { min-width: 0; padding-inline: 8px; overflow: hidden; color: #3c4043; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .android-suggestion + .android-suggestion { border-left: 1px solid #dfe1e5; }
    .keyboard-row { display: grid; gap: 5px; margin-top: 6px; }
    .keyboard-row.ten { grid-template-columns: repeat(10, minmax(0, 1fr)); }
    .keyboard-row.nine { grid-template-columns: repeat(9, minmax(0, 1fr)); padding-inline: 14px; }
    .keyboard-row.shift { grid-template-columns: 1.35fr repeat(7, minmax(0, 1fr)) 1.35fr; }
    .keyboard-row.android-bottom { grid-template-columns: 1.25fr .7fr .7fr 3.4fr .7fr 1.25fr; }
    .keyboard-key { min-width: 0; height: 38px; display: grid; place-items: center; border-radius: 7px; background: white; box-shadow: 0 1px 1px rgba(60, 64, 67, .28); white-space: nowrap; }
    .keyboard-key.utility { background: #d8dce2; color: #3c4043; box-shadow: none; }
    .keyboard-key.space { color: #5f6368; font-size: 11px; font-weight: 400; }
    .keyboard-key.send { background: #d9c8d4; color: var(--primary-dark); }
    .android-gesture-bar { height: 30px; position: relative; display: grid; place-items: end center; }
    .android-gesture-bar::before { width: 108px; height: 4px; border-radius: 999px; background: #4a4d50; content: ""; }
    .android-hide-keyboard { position: absolute; left: 2px; bottom: -7px; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #4a4d50; display: grid; place-items: center; cursor: pointer; }
    .ask-sheet.is-visible.show-android-keyboard-preview .android-keyboard-preview { display: block; }
    .ask-sheet.chat-view.show-android-keyboard-preview .android-keyboard-preview { flex: 0 0 auto; margin-top: 10px; }

    @media (hover: hover) and (pointer: fine) {
      .ask-sheet-close:hover, .ask-answer-action:hover, .ask-composer-action:hover { background: var(--plum-soft); color: var(--primary); }
      .ask-composer-action.is-send:hover { background: var(--primary-dark); color: white; }
    }


    #closeSource,#closeUtility,#closeFeedback,#closeAskOvie{background:transparent;color:var(--icon-default)}
    #closeSource:hover,#closeUtility:hover,#closeFeedback:hover,#closeAskOvie:hover{background:transparent;color:var(--icon-default)}
    .chat-dock .ask-sheet-composer-row{width:100%}.chat-dock .ask-sheet-input{padding-inline:12px;cursor:text}
    .ask-sheet-input{width:100%;padding-inline:12px}.ask-sheet-input-row input:focus-visible{box-shadow:none;outline:0}
    #askOvieSheet{bottom:var(--keyboard-inset,0px);max-height:calc(var(--visual-viewport-height,100dvh) - 12px);overflow:hidden}
    #askOvieSheet .ask-sheet-inner{max-height:calc(var(--visual-viewport-height,100dvh) - 12px);overflow-y:auto}
    #askOvieSheet.chat-view{height:calc(var(--visual-viewport-height,100dvh) - 52px);max-height:none}
    #askOvieSheet .ask-sheet-conversation[hidden]{display:none}
    .ask-composer-action{color:var(--icon-inverse)}.ask-sheet-title .ovie-assistant-mark{color:var(--icon-brand)}
    .ask-answer-actions .secondary-action{padding:10px 12px}
    @media(pointer:coarse){.android-keyboard-preview{display:none!important}}
</style></head><body>
<div class="canvas"><div class="phone" id="phone"><header class="topbar"><div class="titlebar"><button class="icon-button" id="backButton" aria-label="Back to insights"><svg class="" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M19 12H5"/></svg></button><h1>Insights</h1><button class="icon-button" id="searchButton" aria-label="Search these insights"><svg class="" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button><button class="icon-button" id="shareButton" type="button" aria-label="Share insights"><svg class="" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/></svg></button></div></header><main><div class="feedback" role="group" aria-labelledby="feedback-question">
        <span class="feedback-question" id="feedback-question">Were these insights helpful?</span>
        <button class="feedback-button" type="button" data-feedback="up" aria-label="Yes, these insights were helpful" aria-pressed="false"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg></button>
        <button class="feedback-button" type="button" data-feedback="down" aria-label="No, these insights were not helpful" aria-pressed="false"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"></path><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"></path></svg></button>
      </div>

</main><form class="chat-dock" id="chatForm" novalidate>
        <label for="chatInput" class="sr-only">Ask Ovie about this policy</label>
        <div class="ask-sheet-composer-row">
          <div class="ask-sheet-input-row">
            <input class="ask-sheet-input" id="chatInput" type="text" placeholder="Ask anything about this policy..." autocomplete="off" readonly aria-haspopup="dialog" aria-controls="askOvieSheet">
          </div>
          <button class="ask-composer-action" id="chatAskButton" type="submit" aria-label="Ask Ovie" aria-haspopup="dialog" aria-controls="askOvieSheet"><svg class="composer-mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></button>
        </div>
      </form></div></div>
<dialog class="ask-sheet" id="askOvieSheet" aria-labelledby="askOvieTitle">
    <div class="ask-sheet-inner">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="ask-sheet-header">
        <h2 class="ask-sheet-title" id="askOvieTitle"><svg class="ovie-assistant-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 4h8a5 5 0 0 1 5 5v5.5a4.5 4.5 0 0 1-4.5 4.5H15l-3 2.5V19H7.5A4.5 4.5 0 0 1 3 14.5V9a5 5 0 0 1 5-5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="7.55" y="9.25" width="2.5" height="4.7" rx="1.25" fill="currentColor"/><rect x="13.95" y="9.25" width="2.5" height="4.7" rx="1.25" fill="currentColor"/></svg><span>Ask Ovie</span></h2>
        <button class="ask-sheet-close" id="closeAskOvie" type="button" aria-label="Close Ask Ovie"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="ask-sheet-conversation" id="askOvieConversation" aria-live="polite" hidden>
        <div class="ask-user-message" id="askOvieQuestion"></div>
        <div><p class="ask-response-text" id="askOvieAnswer"></p>
          <div class="ask-answer-actions" id="askSourceActions"></div>
        </div>
      </div>
      <form class="ask-sheet-form" id="askOvieForm" novalidate>
        <label class="sr-only" for="askOvieInput">Ask anything about this policy</label>
        <div class="ask-sheet-composer-row">
          <div class="ask-sheet-input-row">
            <input class="ask-sheet-input" id="askOvieInput" name="question" type="text" inputmode="text" enterkeyhint="send" autocomplete="off" placeholder="Ask anything about this policy...">
          </div>
          <button class="ask-composer-action" id="askComposerAction" type="button" aria-label="Use voice input" title="Use voice input"><svg class="composer-mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg><svg class="composer-send-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
        </div>
      </form>
      <p class="ask-ovie-disclaimer">Ovie provides policy summaries only and does not offer policy recommendations or insurance advice.</p>
      <div class="android-keyboard-preview">
        <div class="android-suggestions" aria-hidden="true"><span class="android-suggestion">your</span><span class="android-suggestion">coverage</span><span class="android-suggestion">policy</span></div>
        <div class="keyboard-row ten" aria-hidden="true"><span class="keyboard-key">Q</span><span class="keyboard-key">W</span><span class="keyboard-key">E</span><span class="keyboard-key">R</span><span class="keyboard-key">T</span><span class="keyboard-key">Y</span><span class="keyboard-key">U</span><span class="keyboard-key">I</span><span class="keyboard-key">O</span><span class="keyboard-key">P</span></div>
        <div class="keyboard-row nine" aria-hidden="true"><span class="keyboard-key">A</span><span class="keyboard-key">S</span><span class="keyboard-key">D</span><span class="keyboard-key">F</span><span class="keyboard-key">G</span><span class="keyboard-key">H</span><span class="keyboard-key">J</span><span class="keyboard-key">K</span><span class="keyboard-key">L</span></div>
        <div class="keyboard-row shift" aria-hidden="true"><span class="keyboard-key utility">⇧</span><span class="keyboard-key">Z</span><span class="keyboard-key">X</span><span class="keyboard-key">C</span><span class="keyboard-key">V</span><span class="keyboard-key">B</span><span class="keyboard-key">N</span><span class="keyboard-key">M</span><span class="keyboard-key utility">⌫</span></div>
        <div class="keyboard-row android-bottom" aria-hidden="true"><span class="keyboard-key utility">?123</span><span class="keyboard-key utility">,</span><span class="keyboard-key utility">●</span><span class="keyboard-key space">English (US)</span><span class="keyboard-key utility">.</span><span class="keyboard-key utility send">→</span></div>
        <div class="android-gesture-bar"><button class="android-hide-keyboard" id="hidePreviewKeyboard" type="button" aria-label="Hide keyboard" title="Hide keyboard"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
      </div>
    </div>
  </dialog>
<dialog id="sourceSheet" aria-labelledby="sourceTitle"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-head"><h2 id="sourceTitle">Source</h2><button class="icon-button" id="closeSource" aria-label="Close source"><svg class="" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div><div class="sheet-body" id="sourceBody"></div></dialog>
<dialog id="feedbackSheet" aria-labelledby="feedbackTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="feedbackTitle">Tell us more</h2><button class="icon-button sheet-close" id="closeFeedback" type="button" aria-label="Close feedback form"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
    <div class="sheet-body">
      <form class="feedback-form" id="feedbackForm" novalidate>
        <fieldset><legend class="sr-only">What could be improved?</legend>
          <label class="feedback-option"><span>Insights are unclear or confusing</span><input type="radio" name="reason" value="unclear"></label>
          <label class="feedback-option"><span>Information is incorrect</span><input type="radio" name="reason" value="incorrect"></label>
          <label class="feedback-option"><span>Missing or incomplete details</span><input type="radio" name="reason" value="missing"></label>
          <label class="feedback-option"><span>Other (tell us more)</span><input type="radio" name="reason" value="other"></label>
        </fieldset>
        <div class="feedback-followup" id="feedbackFollowup" hidden><label for="feedbackConcern">Enter your concern here</label><textarea id="feedbackConcern" name="concern" placeholder="Type here"></textarea></div>
        <p class="error" id="feedbackError" role="alert" aria-live="polite"></p>
        <button class="primary-action" type="submit">Submit</button><button class="secondary-action" id="cancelFeedback" type="button">Cancel</button>
      </form>
    </div>
  </dialog>
<dialog id="utilitySheet" aria-labelledby="utilityTitle"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-head"><h2 id="utilityTitle">Search insights</h2><button class="icon-button" id="closeUtility" aria-label="Close panel"><svg class="" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div><div class="sheet-body" id="utilityBody"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
