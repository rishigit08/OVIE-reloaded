<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6B4062" />
    <title>Insights · Ovie</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap");

      :root {
        font-family: Figtree, system-ui, sans-serif;
        color: #111;
        background: #f6f6f6;
        font-synthesis: none;
        --primary: #6b4062;
        --primary-dark: #54324d;
        --primary-soft: #f5edf3;
        --text-primary: #111111;
        --text-secondary: #333a3d;
        --text-tertiary: #5f6368;
        --surface: #ffffff;
        --canvas: #f6f6f6;
        --line: #ecefed;
        --border: #d8dddb;
        --radius: 12px;
        --ink: #111111;
        --copy: #333a3d;
        --muted: #5f6368;
        --border-soft: #ecefed;
        --bg-subtle: #f6f6f6;
        --success: #0d7d07;
        --danger: #a63a33;
        --focus: #6b4062;
        --ai-gradient-start: #bd4ba5;
        --ai-gradient-end: #5c2e8b;
        --nav-height: 72px;
        --z-fab: 450;
        --z-backdrop: 500;
        --z-sheet: 700;
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
        --motion-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --motion-duration-press: 160ms;
        --motion-duration-standard: 200ms;
        --motion-duration-overlay: 260ms;
        --motion-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --motion-ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      }

      * { box-sizing: border-box; }
      html { min-width: 320px; scrollbar-width: none; }
      html::-webkit-scrollbar { display: none; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #e3e3e3;
        -webkit-font-smoothing: antialiased;
      }
      body.sheet-open { overflow: hidden; }
      button, input { font: inherit; }
      button { cursor: pointer; }
      button { -webkit-tap-highlight-color: transparent; }
      button:focus-visible, input:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--primary) 35%, transparent);
        outline-offset: 2px;
      }
      h1, h2, p { margin: 0; }
      h1, h2 { font-weight: 600; }
      .sr-only, .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .app-shell {
        width: min(100%, 390px);
        min-height: 100vh;
        margin: 0 auto;
        background: var(--canvas);
      }
      .workspace { width: 100%; min-width: 0; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 15;
        background: transparent;
        pointer-events: none;
      }
      .phone-status-bar {
        height: 34px;
        padding: 8px 22px 0;
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.97);
        color: var(--text-primary);
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
      }
      .phone-status-icons {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--text-tertiary);
      }
      .topbar-inner {
        min-height: 58px;
        padding: 4px 18px 12px;
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.97);
        border-bottom: 1px solid var(--line);
        pointer-events: auto;
        transform: translateY(0);
        transition: transform var(--motion-duration-standard) var(--motion-ease-out);
        will-change: transform;
      }
      .topbar.is-hidden .topbar-inner { transform: translateY(-100%); pointer-events: none; }
      .topbar h1 { font-size: 18px; line-height: 24px; }

      .main-content { padding: 18px 16px 176px; }
      .search-row {
        width: 100%;
        max-width: 358px;
        min-height: 44px;
        margin: -4px auto 18px;
        padding: 0 13px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--surface);
        color: var(--text-tertiary);
      }
      .search-row:focus-within {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent);
      }
      .search-row input {
        width: 100%;
        height: 42px;
        min-width: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text-primary);
        font-size: 14px;
      }
      .search-row input::placeholder { color: var(--text-tertiary); opacity: 1; }
      .search-row input::-webkit-search-cancel-button { appearance: none; }
      .icon-button {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        display: inline-grid;
        place-items: center;
        background: transparent;
        color: var(--text-tertiary);
        transition: transform var(--motion-duration-press) var(--motion-ease-out);
      }
      .search-clear { margin-right: -12px; flex: 0 0 auto; }
      .search-clear[hidden] { display: none; }

      .filter-chips {
        width: 100%;
        max-width: 358px;
        margin: 0 auto 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .filter-chips::-webkit-scrollbar { display: none; }
      .filter-chip {
        min-height: 44px;
        padding: 0;
        border: 0;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        background: transparent;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        white-space: nowrap;
      }
      .filter-chip-face {
        min-height: 36px;
        padding: 0 14px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        background: var(--surface);
      }
      .filter-chip-face { gap: 8px; }
      .filter-chip-count {
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        display: inline-grid;
        place-items: center;
        background: var(--line);
        color: var(--text-tertiary);
        font-size: 11px;
        line-height: 16px;
      }
      .filter-chip[aria-checked="true"] { color: var(--primary); }
      .filter-chip[aria-checked="true"] .filter-chip-count { background: var(--surface); color: var(--primary); }
      .filter-chip[aria-checked="true"] .filter-chip-face { background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }

      .insight-list {
        width: 100%;
        max-width: 358px;
        margin: 12px auto 0;
        display: grid;
        gap: 8px;
      }
      .insight-row {
        position: relative;
        min-height: 124px;
        padding: 12px 0 12px 12px;
        border-radius: var(--radius);
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 56px;
        gap: 10px;
        align-items: center;
        background: var(--surface);
      }
      .insight-open {
        position: absolute;
        z-index: 0;
        inset: 0;
        width: 100%;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        transition: transform var(--motion-duration-press) var(--motion-ease-out);
      }
      .insight-row > :not(.insight-open) { position: relative; z-index: 1; pointer-events: none; }
      .insight-row .policy-number-toggle, .insight-row .insight-options { pointer-events: auto; }
      .insight-icon {
        width: 40px;
        height: 40px;
        align-self: start;
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        background: var(--primary-soft);
        color: var(--primary);
      }
      .insight-copy { min-width: 0; align-self: start; }
      .insight-title { display: block; font-size: 14px; line-height: 20px; font-weight: 600; overflow-wrap: anywhere; }
      .policy-line { margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .policy-type-tag {
        min-height: 20px;
        padding: 2px 7px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 11px;
        line-height: 16px;
        font-weight: 600;
      }
      .policy-number-line {
        min-height: 32px;
        margin-top: 1px;
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--text-tertiary);
        font-size: 12px;
        line-height: 16px;
      }
      .policy-number-line strong { color: var(--text-secondary); font-size: 12px; line-height: 16px; font-weight: 600; overflow-wrap: anywhere; }
      .policy-number-toggle { width: 44px; height: 32px; margin: -6px 0 -6px -5px; padding: 0; border: 0; display: inline-grid; place-items: center; background: transparent; color: var(--text-tertiary); }
      .scope-line { display: block; margin-top: 6px; color: var(--text-secondary); font-size: 12px; line-height: 16px; font-weight: 600; }
      .generated-date { display: block; margin-top: 4px; color: var(--text-tertiary); font-size: 12px; line-height: 16px; }
      .insight-row.no-options { grid-template-columns: 44px minmax(0, 1fr); padding-right: 12px; }
      .insight-options { margin-right: 12px; justify-self: end; align-self: center; }

      .empty-state { padding: 54px 16px; display: grid; justify-items: center; text-align: center; color: var(--text-tertiary); }
      .empty-state h2 { margin-top: 12px; color: var(--text-primary); font-size: 18px; line-height: 24px; }
      .empty-state p { margin-top: 5px; font-size: 14px; line-height: 20px; }

      .mobile-nav {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: max(8px, env(safe-area-inset-bottom));
        width: min(calc(100% - 24px), 366px);
        min-height: 72px;
        padding: 6px;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: center;
        transform: translateX(-50%);
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        box-shadow: 0 4px 8px rgba(17, 17, 17, 0.1);
      }
      .mobile-nav button {
        min-width: 0;
        min-height: 58px;
        padding: 5px 2px;
        border: 0;
        border-radius: 999px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        background: transparent;
        color: var(--text-tertiary);
        font-size: 11px;
        line-height: 16px;
        font-weight: 600;
        transition: transform var(--motion-duration-press) var(--motion-ease-out);
      }
      .mobile-nav button[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
      .nav-icon { width: 32px; height: 28px; display: grid; place-items: center; border-radius: 999px; }
      .mobile-nav .upload-nav { background: transparent; color: #fff; }
      .upload-nav .nav-icon { position: relative; }
      .upload-nav .nav-icon::before {
        width: 48px;
        height: 48px;
        position: absolute;
        z-index: 0;
        inset: 50% auto auto 50%;
        content: "";
        transform: translate(-50%, -50%);
        border-radius: 999px;
        background: var(--primary);
        box-shadow: 0 2px 4px rgba(84, 50, 77, 0.22);
      }
      .upload-nav svg { position: relative; z-index: 1; }

      dialog.sheet-dialog {
        position: fixed;
        inset: auto auto 0 50%;
        width: min(100%, 390px);
        max-width: none;
        max-height: min(86dvh, 720px);
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 12px 12px 0 0;
        background: var(--surface);
        color: var(--text-primary);
        overflow: hidden;
        transform: translate(-50%, 100%);
        transition: transform var(--motion-duration-overlay) var(--motion-ease-drawer);
      }
      dialog.sheet-dialog::backdrop {
        background: rgba(17, 24, 23, 0.58);
        opacity: 0;
        transition: opacity var(--motion-duration-overlay) var(--motion-ease-out);
      }
      dialog.sheet-dialog.is-visible { transform: translate(-50%, 0); }
      dialog.sheet-dialog.is-visible::backdrop { opacity: 1; }
      .sheet {
        width: 100%;
        max-height: inherit;
        padding: 8px 16px max(24px, env(safe-area-inset-bottom));
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .sheet-handle { width: 36px; height: 4px; margin: 0 auto 8px; border-radius: 999px; background: var(--border); }
      .sheet-header { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .sheet-header h2 { min-width: 0; font-size: 18px; line-height: 24px; overflow-wrap: anywhere; }
      .sheet-actions button {
        width: 100%;
        min-height: 60px;
        padding: 8px 4px;
        border: 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
        background: transparent;
        color: var(--text-primary);
        text-align: left;
        font-size: 14px;
        font-weight: 600;
      }
      .sheet-actions button:last-child { border-bottom: 0; }
      .sheet-action-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        background: var(--primary-soft);
        color: var(--primary);
      }

      .toast {
        position: fixed;
        z-index: 60;
        left: 50%;
        bottom: 94px;
        max-width: calc(100% - 32px);
        padding: 11px 15px;
        border-radius: var(--radius);
        background: #242125;
        color: #fff;
        font-size: 14px;
        opacity: 0;
        transform: translate(-50%, 12px);
        pointer-events: none;
        transition: opacity var(--motion-duration-standard) var(--motion-ease-out), transform var(--motion-duration-standard) var(--motion-ease-out);
      }
      .toast.visible { opacity: 1; transform: translate(-50%, 0); }

      .icon-button:active, .insight-open:active, .mobile-nav button:active { transform: scale(0.97); }
      @media (hover: hover) and (pointer: fine) {
        .icon-button:hover { background: var(--primary-soft); color: var(--primary); }
        .insight-open:hover { background: #faf8fa; }
        .sheet-actions button:hover { background: var(--canvas); }
      }
      @media (prefers-reduced-motion: reduce) {
        .topbar-inner, .icon-button, .insight-open, .mobile-nav button, .toast { transition-duration: 0.01ms; }
        .topbar.is-hidden .topbar-inner { transform: none; }
        .icon-button:active, .insight-open:active, .mobile-nav button:active, .toast, .toast.visible { transform: none; }
        dialog.sheet-dialog { transform: translate(-50%, 0); opacity: 0; transition: opacity 120ms var(--motion-ease-out); }
        dialog.sheet-dialog::backdrop { transition: opacity 120ms var(--motion-ease-out); }
        dialog.sheet-dialog.is-visible { opacity: 1; }
      }
      .ask-close {
        width: 44px;
        height: 44px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background-color 160ms var(--ease), transform 160ms var(--ease);
      }
      .ask-close:active { transform: scale(.96); }
      @media (hover: hover) and (pointer: fine) {
        .ask-close:hover { background: var(--primary-soft); color: var(--primary); }
      }
      .ask-sheet .section-heading, .policy-picker-sheet .section-heading { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; }

      .ask-fab {
        position: fixed;
        z-index: var(--z-fab);
        right: max(18px, calc((100vw - 390px) / 2 + 18px));
        bottom: calc(var(--nav-height) + 22px + env(safe-area-inset-bottom));
        width: 56px;
        height: 56px;
        padding: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--ai-gradient-start) 0%, var(--ai-gradient-end) 100%);
        color: var(--surface);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 4px 8px rgba(84, 50, 77, .28);
        cursor: pointer;
        isolation: isolate;
        transition: transform 160ms var(--ease);
      }

      .ask-fab::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        background: rgba(255, 255, 255, .10);
        content: "";
        opacity: 0;
        transition: opacity 160ms var(--ease);
      }

      .ask-fab:active { transform: scale(.96); }

      .ovie-assistant-mark {
        width: 24px;
        height: 24px;
        display: block;
        flex: 0 0 auto;
        overflow: visible;
      }

      .ask-fab .ovie-assistant-mark { width: 28px; height: 28px; }

      @media (hover: hover) and (pointer: fine) {
        .ask-fab:hover::before { opacity: 1; }
      }

      .ask-sheet {
        position: fixed;
        z-index: var(--z-sheet);
        inset: auto auto var(--keyboard-inset, 0px) 50%;
        width: min(100%, 480px);
        max-width: none;
        max-height: min(calc(var(--visual-viewport-height, 100dvh) - 12px), 560px);
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: var(--radius) var(--radius) 0 0;
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 -4px 8px rgba(17, 17, 17, .12);
        opacity: 1;
        transform: translate(-50%, 100%);
        transition: transform var(--motion-duration-overlay) var(--motion-ease-drawer);
        will-change: transform;
      }

      .ask-sheet[open].is-visible { transform: translate(-50%, 0); }

      .ask-sheet.chat-view {
        inset: calc(var(--visual-viewport-top, 0px) + 52px) auto auto 50%;
        width: min(100%, 480px);
        height: calc(var(--visual-viewport-height, 100dvh) - 52px);
        max-height: none;
        border-radius: var(--radius) var(--radius) 0 0;
        transform: translate(-50%, 0);
      }

      .ask-sheet[open].is-visible.chat-view { transform: translate(-50%, 0); }
      .ask-sheet.chat-view:not(.is-visible) { transform: translate(-50%, 100%); }

      .ask-sheet::backdrop {
        z-index: var(--z-backdrop);
        background: rgba(17, 24, 23, .58);
        opacity: 0;
        transition: opacity var(--motion-duration-overlay) var(--motion-ease-out);
      }

      .ask-sheet.is-visible::backdrop { opacity: 1; }

      .ask-sheet-inner {
        padding: 8px 16px calc(18px + env(safe-area-inset-bottom));
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .ask-sheet.chat-view .ask-sheet-inner {
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .ask-sheet.chat-view .sheet-handle { display: none; }

      .ask-sheet.chat-view .ask-sheet-header {
        flex: 0 0 auto;
        margin: -8px -16px 0;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border-soft);
      }

      .ask-sheet-header {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .ask-sheet-title { display: flex; align-items: center; gap: 8px; }
      .ask-sheet-title .ovie-assistant-mark { width: 22px; height: 22px; color: var(--primary); }

      .ask-sheet-conversation {
        min-height: 0;
        padding: 20px 2px 16px;
        display: none;
        flex: 1;
        flex-direction: column;
        gap: 18px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .ask-sheet.chat-view .ask-sheet-conversation { display: flex; }

      .ask-user-message {
        max-width: 84%;
        margin-left: auto;
        padding: 10px 14px;
        border-radius: 12px 12px 2px 12px;
        background: var(--primary);
        color: var(--surface);
        font-weight: 500;
        overflow-wrap: anywhere;
      }

      .ask-ovie-response { display: block; }
      .ask-response-body { min-width: 0; flex: 1; }
      .ask-response-text { margin: 0; color: var(--copy); white-space: pre-line; }

      .ask-answer-actions {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .ask-answer-action,
      .ask-composer-action {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        padding: 0;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background-color 160ms var(--ease), color 160ms var(--ease), transform 160ms var(--ease);
      }

      .ask-answer-action { border: 1px solid var(--border-soft); background: var(--surface); }
      .ask-answer-action:active,
      .ask-composer-action:active { transform: scale(.96); }
      .ask-answer-action[aria-pressed="true"][data-answer-action="helpful"] { color: var(--success); }
      .ask-answer-action[aria-pressed="true"][data-answer-action="not-helpful"] { color: var(--danger); }
      .ask-answer-action.is-saved { color: var(--primary); background: var(--primary-soft); }

      @media (hover: hover) and (pointer: fine) {
        .ask-answer-action:hover,
        .ask-composer-action:hover { background: var(--primary-soft); color: var(--primary); }
      }

      .ask-sheet-form { width: 100%; margin: 8px auto 0; flex: 0 0 auto; }
      .ask-sheet.chat-view .ask-sheet-form { margin-top: auto; }

      .ask-ovie-disclaimer {
        margin: 8px 8px 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 16px;
        text-align: center;
      }

      .ask-sheet.keyboard-visible .ask-ovie-disclaimer,
      .ask-sheet.show-android-keyboard-preview .ask-ovie-disclaimer { display: none; }

      .ask-sheet-composer-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ask-sheet-input-row {
        min-height: 56px;
        min-width: 0;
        flex: 1;
        padding: 5px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .ask-sheet-input-row:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent);
      }

      .ask-sheet-input {

      const list = document.querySelector(".insight-list");
      const search = document.querySelector("#insight-search");
      const clearSearch = document.querySelector(".search-clear");

      const actionTitle = document.querySelector("#action-sheet-title");
      const toast = document.querySelector(".toast");
      let selectedFilter = "policy";
      let activeInsight = null;
      let returnFocus = null;
      let toastTimer;

      function icon(type, size = 22) {
        return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPaths[type] || iconPaths.All}</svg>`;
      }

      function policyNumberIcon(revealed) {
        const paths = revealed
          ? '<path d="M2.1 12a10.9 10.9 0 0 1 19.8 0 10.9 10.9 0 0 1-19.8 0Z"/><circle cx="12" cy="12" r="3"/>'
          : '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/>';
        return `<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
      }

      function masked(number) { return `${number.slice(0, 2)}••••${number.slice(-4)}`; }

      function filteredInsights() {
        const term = search.value.trim().toLowerCase();
        return insights.filter(item => {
          const haystack = `${item.title} ${item.tag} ${item.policyNumber || ""} ${item.scope || ""}`.toLowerCase();
          return item.category === selectedFilter && (!term || haystack.includes(term));
        });
      }

      function filterCount(value) { return insights.filter(item => item.category === value).length; }

      function renderChips() {
        chipGroup.innerHTML = filters.map(filter => `<button type="button" role="radio" class="filter-chip" data-filter="${filter.value}" aria-label="${filter.label}, ${filterCount(filter.value)}" aria-checked="${selectedFilter === filter.value}"><span class="filter-chip-face">${filter.label}<span class="filter-chip-count">${filterCount(filter.value)}</span></span></button>`).join("");
      }

      function render() {
        const visible = filteredInsights();
        clearSearch.hidden = !search.value;

        if (!visible.length) {
          list.innerHTML = `<div class="empty-state">${icon("All", 24)}<h2>No matching insights</h2><p>Try another search or filter.</p></div>`;
          return;
        }

        list.innerHTML = visible.map(item => `
          <article class="insight-row${item.category === "general" ? " no-options" : ""}" role="listitem" data-id="${item.id}">
            <button type="button" class="insight-open" aria-label="Open ${item.title} insights"></button>
            <span class="insight-icon">${icon(item.icon)}</span>
            <span class="insight-copy">
              <strong class="insight-title">${item.title}</strong>
              <span class="policy-line"><span class="policy-type-tag">${item.tag}</span></span>
              ${item.policyNumber ? `<span class="policy-number-line">
                <strong data-policy-number>${masked(item.policyNumber)}</strong>
                <button type="button" class="policy-number-toggle" aria-label="Show policy number for ${item.title}" aria-pressed="false">
                  ${policyNumberIcon(false)}
                </button>
              </span>` : `<span class="scope-line">${item.scope}</span>`}
