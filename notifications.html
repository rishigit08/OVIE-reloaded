  <style>
    :root {
      --primary: #6b4062;
      --primary-dark: #54324d;
      --primary-soft: #f5edf3;
      --ink: #111111;
      --copy: #333a3d;
      --muted: #5f6368;
      --surface: #ffffff;
      --bg-canvas: #f6f6f6;
      --bg-subtle: #f6f6f6;
      --prototype-backdrop: #e3e3e3;
      --border: #d8dddb;
      --border-soft: #ecefed;
      --warning: #8a5a06;
      --warning-ink: #634106;
      --warning-soft: #fff5df;
      --danger: #a63a33;
      --danger-soft: #ffeded;
      --success: #0d7d07;
      --success-soft: #e7fff4;
      --focus: #6b4062;
      --radius: 12px;
      --motion-duration-press: 160ms;
      --motion-ease-out: cubic-bezier(.23, 1, .32, 1);
      --z-sticky: 100;
      --z-toast: 900;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; scrollbar-gutter: stable; scrollbar-width: thin; }
    body {
      margin: 0; min-height: 100vh; background: var(--prototype-backdrop); color: var(--ink);
      font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    svg { display: block; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 3px solid rgba(107, 64, 98, .24); outline-offset: 2px; }

    .app-shell { position: relative; width: min(100%, 480px); min-height: 100vh; margin: 0 auto; background: var(--bg-canvas); }

    .top-shell { position: sticky; top: 0; z-index: var(--z-sticky); background: var(--surface); border-bottom: 1px solid var(--border-soft); }
    .status-bar { min-height: 36px; padding: 8px 18px 2px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; line-height: 16px; font-weight: 600; }
    .status-icons { display: flex; align-items: center; gap: 5px; color: var(--muted); }
    .app-header { padding: 8px 16px 14px; display: flex; align-items: center; gap: 8px; }
    .app-title { margin: 0; flex: 1; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -.012em; }
    .icon-button {
      width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border: 0; border-radius: var(--radius);
      background: transparent; color: var(--ink); cursor: pointer;
      transition: transform var(--motion-duration-press) var(--motion-ease-out), background-color 180ms ease;
    }
    .icon-button:active { transform: scale(.97); }

    .tabs { display: flex; gap: 8px; padding: 0 16px 8px; background: var(--surface); }
    .tab {
      min-height: 44px; padding: 0; border: 0; background: transparent; display: inline-flex; align-items: center;
      color: var(--copy); font-weight: 600; cursor: pointer;
    }
    .tab-face { min-height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; background: var(--bg-subtle); }
    .tab-count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--surface); color: var(--muted); font-size: 11px; line-height: 16px; }
    .tab[aria-selected="true"] { color: var(--primary); }
    .tab[aria-selected="true"] .tab-face { background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
    .tab[aria-selected="true"] .tab-count { color: var(--primary); }
    .tab:active .tab-face { transform: scale(.97); }
    .tab-face { transition: transform var(--motion-duration-press) var(--motion-ease-out); }

    main { display: flex; flex-direction: column; gap: 18px; padding: 18px 16px 40px; }
    .panel-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 24px; }
    .panel-summary { margin: 0; color: var(--muted); }
    .text-button { min-height: 44px; margin: -10px -8px -10px 0; padding: 0 8px; border: 0; background: transparent; color: var(--primary); font-weight: 600; cursor: pointer; border-radius: var(--radius); }
    .text-button:disabled { color: var(--muted); cursor: default; }

    .card { overflow: hidden; border-radius: var(--radius); background: var(--surface); }
    .card-head { padding: 16px 16px 8px; }
    .section-heading { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -.012em; }
    .row {
      width: 100%; min-height: 64px; padding: 12px 16px; border: 0; border-top: 1px solid var(--border-soft); background: var(--surface);
      display: flex; align-items: flex-start; gap: 12px; text-align: left; cursor: pointer;
      transition: transform var(--motion-duration-press) var(--motion-ease-out), background-color 180ms ease;
    }
    .row:first-of-type { border-top: 0; }
    .row:active { transform: scale(.97); }
    @media (hover: hover) and (pointer: fine) { .row:hover { background: var(--bg-subtle); } }
    .row-icon { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; background: var(--primary-soft); color: var(--primary); }
    .row.tone-warning .row-icon { background: var(--warning-soft); color: var(--warning); }
    .row.tone-warning .row-title { color: var(--warning-ink); }
    .row.tone-danger .row-icon { background: var(--danger-soft); color: var(--danger); }
    .row.tone-success .row-icon { background: var(--success-soft); color: var(--success); }
    .row.tone-neutral .row-icon { background: var(--bg-subtle); color: var(--muted); }
    .row-copy { flex: 1; min-width: 0; }
    .row-title { display: block; font-weight: 400; }
    .row.unread .row-title { font-weight: 600; }
    .row-body { display: block; margin-top: 2px; color: var(--muted); }
    .row-time { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 16px; font-weight: 600; }
    .row-flag { width: 44px; margin: -10px -12px -10px 0; flex: 0 0 auto; align-self: flex-start; min-height: 40px; display: grid; place-items: center; }
    .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
    .row:not(.unread) .unread-dot { visibility: hidden; }
    .priority { margin-left: 8px; padding: 0 8px; border-radius: 999px; background: var(--bg-subtle); color: var(--muted); font-size: 11px; line-height: 16px; font-weight: 600; vertical-align: 1px; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: var(--z-toast); max-width: min(calc(100% - 32px), 440px); padding: 12px 16px;
      border-radius: var(--radius); background: var(--ink); color: #fff; font-weight: 600;
      opacity: 0; transform: translate(-50%, 8px); pointer-events: none;
      transition: opacity 200ms var(--motion-ease-out), transform 200ms var(--motion-ease-out);
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      .icon-button:active, .row:active, .tab:active .tab-face { transform: none; }
      .toast { transform: translate(-50%, 0); transition: opacity 125ms ease; }
    }
  </style>
</head>

      };

      const read = new Set();
      try { JSON.parse(sessionStorage.getItem('ovieNotifRead') || '[]').forEach((id) => read.add(id)); } catch (e) {}
      const persist = () => { try { sessionStorage.setItem('ovieNotifRead', JSON.stringify([...read])); } catch (e) {} };

      const panel = document.querySelector('#panel');
      const summary = document.querySelector('#summary');
      const markAll = document.querySelector('#markAll');
      const toast = document.querySelector('#toast');
      let current = 'alerts';
      let toastTimer;

      const showToast = (msg) => {
        toast.textContent = msg;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2400);
      };
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const unreadIn = (tab) => DATA[tab].flatMap((g) => g.rows).filter((r) => r[6] && !read.has(r[0])).length;

      function render() {
        ['alerts', 'updates'].forEach((t) => { document.querySelector('#count-' + t).textContent = unreadIn(t); });
        const n = unreadIn(current);
        summary.textContent = n ? n + ' unread' : 'You’re all caught up';
        markAll.disabled = !n;
        panel.setAttribute('aria-labelledby', 'tab-' + current);
        panel.innerHTML = DATA[current].map((g, gi) => (
          '<section class="card" aria-labelledby="grp-' + gi + '"><div class="card-head"><h2 class="section-heading" id="grp-' + gi + '">' + esc(g.group) + '</h2></div>' +
          g.rows.map((r) => {
            const unread = r[6] && !read.has(r[0]);
            return '<button class="row tone-' + r[2] + (unread ? ' unread' : '') + '" type="button" data-id="' + r[0] + '"' + (r[7] ? ' data-href="' + r[7] + '"' : '') + '>' +
              '<span class="row-icon" aria-hidden="true">' + icon(r[1]) + '</span>' +
              '<span class="row-copy"><span class="row-title">' + esc(r[3]) + (unread ? '<span class="visually-hidden"> (unread)</span>' : '') + '</span><span class="row-body">' + esc(r[4]) + '</span><span class="row-time">' + esc(r[5]) + '</span></span>' +
              '<span class="row-flag" aria-hidden="true"><span class="unread-dot"></span></span></button>';
          }).join('') + '</section>'
        )).join('');
      }

      panel.addEventListener('click', (e) => {
        const row = e.target.closest('.row');
        if (!row) return;
        read.add(row.dataset.id);
        persist();
        if (row.dataset.href) { location.href = row.dataset.href; return; }
        const title = row.querySelector('.row-title').firstChild.textContent;
        render();
        showToast('Opening ' + title);
        const next = panel.querySelector('[data-id="' + row.dataset.id + '"]');
        if (next) next.focus();
      });

      markAll.addEventListener('click', () => {
        DATA[current].flatMap((g) => g.rows).forEach((r) => read.add(r[0]));
        persist();
        render();
        showToast('All marked as read');
      });

      const tabs = Array.from(document.querySelectorAll('.tab'));
      function selectTab(tab, focus) {
        current = tab.dataset.tab;
        tabs.forEach((t) => { const on = t === tab; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
        render();
        if (focus) tab.focus();
      }
      tabs.forEach((tab) => {
        tab.addEventListener('click', () => selectTab(tab, false));
        tab.addEventListener('keydown', (e) => {
          const i = tabs.indexOf(tab);
          const move = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
          if (move === undefined) return;
          e.preventDefault();
          selectTab(tabs[(move + tabs.length) % tabs.length], true);
        });
      });

      document.querySelector('#backButton').addEventListener('click', () => {
        if (history.length > 1 && document.referrer) history.back(); else location.href = 'index.html';
      });

      const startTab = new URLSearchParams(location.search).get('tab');
      selectTab(tabs.find((t) => t.dataset.tab === startTab) || tabs[0], false);
    })();
  </script>
</body>
</html>
