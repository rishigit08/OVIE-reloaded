<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notifications | Ovie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b4062;
      --primary-dark: #54324d;
      --primary-soft: #f5edf3;
      --ink: #111111;
      --copy: #333a3d;
      --muted: #5f6368;
      --surface: #ffffff;
      --bg-canvas: #f6f6f6;
      --bg-subtle: #f6f6f6;
      --prototype-backdrop: #e3e3e3;
      --border: #d8dddb;
      --border-soft: #ecefed;
      --warning: #8a5a06;
      --warning-ink: #634106;
      --warning-soft: #fff5df;
      --danger: #a63a33;
      --danger-soft: #ffeded;
      --success: #0d7d07;
      --success-soft: #e7fff4;
      --focus: #6b4062;
      --radius: 12px;
      --motion-duration-press: 160ms;
      --motion-ease-out: cubic-bezier(.23, 1, .32, 1);
      --z-sticky: 100;
      --z-toast: 900;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; scrollbar-gutter: stable; scrollbar-width: thin; }
    body {
      margin: 0; min-height: 100vh; background: var(--prototype-backdrop); color: var(--ink);
      font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    svg { display: block; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 3px solid rgba(107, 64, 98, .24); outline-offset: 2px; }

    .app-shell { position: relative; width: min(100%, 480px); min-height: 100vh; margin: 0 auto; background: var(--bg-canvas); }

    .top-shell { position: sticky; top: 0; z-index: var(--z-sticky); background: var(--surface); border-bottom: 1px solid var(--border-soft); }
    .status-bar { min-height: 36px; padding: 8px 18px 2px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; line-height: 16px; font-weight: 600; }
    .status-icons { display: flex; align-items: center; gap: 5px; color: var(--muted); }
    .app-header { padding: 8px 16px 14px; display: flex; align-items: center; gap: 8px; }
    .app-title { margin: 0; flex: 1; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -.012em; }
    .icon-button {
      width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border: 0; border-radius: var(--radius);
      background: transparent; color: var(--ink); cursor: pointer;
      transition: transform var(--motion-duration-press) var(--motion-ease-out), background-color 180ms ease;
    }
    .icon-button:active { transform: scale(.97); }

    .tabs { margin: 0; min-height: 52px; padding: 4px; border-radius: var(--radius); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: rgba(227, 227, 227, .8); }
    .tab {
      min-height: 44px; padding: 0 4px; border: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: transparent; color: var(--muted); font-weight: 600; text-align: center; white-space: nowrap; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--surface); color: var(--primary); }
    @media (hover: hover) and (pointer: fine) { .tab[aria-selected="false"]:hover { color: var(--ink); } }
    .tab-count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--surface); color: var(--muted); font-size: 11px; line-height: 16px; }
    .tab[aria-selected="true"] .tab-count { background: var(--primary-soft); color: var(--primary); }

    main { display: flex; flex-direction: column; gap: 18px; padding: 18px 16px 40px; }
    .text-button { min-height: 44px; margin: -10px -8px -10px 0; padding: 0 8px; border: 0; background: transparent; color: var(--primary); font-weight: 600; cursor: pointer; border-radius: var(--radius); }
    .text-button:disabled { color: var(--muted); cursor: default; }

    .card { overflow: hidden; border-radius: var(--radius); background: var(--surface); }
    .card-head { padding: 16px 16px 8px; }
    .section-heading { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -.012em; }
    .row {
      width: 100%; min-height: 64px; padding: 12px 16px; border: 0; border-top: 1px solid var(--border-soft); background: var(--surface);
      display: flex; align-items: flex-start; gap: 12px; text-align: left; cursor: pointer;
      transition: transform var(--motion-duration-press) var(--motion-ease-out), background-color 180ms ease;
    }
    .row:first-of-type { border-top: 0; }
    .row:active { transform: scale(.97); }
    @media (hover: hover) and (pointer: fine) { .row:hover { background: var(--bg-subtle); } }
    .row-icon { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; background: var(--primary-soft); color: var(--primary); }
    .row.tone-warning .row-icon { background: var(--warning-soft); color: var(--warning); }
    .row.tone-warning .row-title { color: var(--warning-ink); }
    .row.tone-danger .row-icon { background: var(--danger-soft); color: var(--danger); }
    .row.tone-success .row-icon { background: var(--success-soft); color: var(--success); }
    .row.tone-neutral .row-icon { background: var(--bg-subtle); color: var(--muted); }
    .row-copy { flex: 1; min-width: 0; }
    .row-title { display: block; font-weight: 400; }
    .row.unread .row-title { font-weight: 600; }
    .row-body { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 16px; font-weight: 400; }
    .row-side { flex: 0 0 auto; align-self: stretch; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; }
    .row-time { color: var(--muted); font-size: 12px; line-height: 16px; font-weight: 400; white-space: nowrap; }
    .unread-dot { width: 8px; height: 8px; margin: 6px 0 0; border-radius: 50%; background: var(--danger); }
    .row:not(.unread) .unread-dot { visibility: hidden; }
    .priority { margin-left: 8px; padding: 0 8px; border-radius: 999px; background: var(--bg-subtle); color: var(--muted); font-size: 11px; line-height: 16px; font-weight: 600; vertical-align: 1px; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: var(--z-toast); max-width: min(calc(100% - 32px), 440px); padding: 12px 16px;
      border-radius: var(--radius); background: var(--ink); color: #fff; font-weight: 600;
      opacity: 0; transform: translate(-50%, 8px); pointer-events: none;
      transition: opacity 200ms var(--motion-ease-out), transform 200ms var(--motion-ease-out);
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      .icon-button:active, .row:active { transform: none; }
      .toast { transform: translate(-50%, 0); transition: opacity 125ms ease; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-shell">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M1 9h2v3H1zm4-3h2v6H5zm4-3h2v9H9zm4-3h2v12h-2z"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4.5A9.2 9.2 0 0 1 15 4.5M4.7 7.2a5.4 5.4 0 0 1 7.6 0M7.2 9.7a1.8 1.8 0 0 1 2.6 0"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x=".5" y=".5" width="20" height="11" rx="3" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M22 4v4c1-.3 1.5-1 1.5-2S23 4.3 22 4Z" fill="currentColor" opacity=".45"/></svg>
        </span>
      </div>
      <div class="app-header">
        <button class="icon-button" id="backButton" type="button" aria-label="Back to Home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
        <h1 class="app-title">Notifications</h1>
      </div>
    </header>

    <main>
      <div class="tabs" role="tablist" aria-label="Notification type">
        <button class="tab" role="tab" id="tab-alerts" aria-controls="panel" data-tab="alerts" aria-selected="true">Alerts <span class="tab-count" id="count-alerts">0</span></button>
        <button class="tab" role="tab" id="tab-updates" aria-controls="panel" data-tab="updates" aria-selected="false" tabindex="-1">Updates</button>
      </div>
      <div id="panel" role="tabpanel" aria-labelledby="tab-alerts" style="display:flex;flex-direction:column;gap:18px"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const I = {
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        calX: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m14 14-4 4"/><path d="m10 14 4 4"/>',
        calClock: '<path d="M8 2v4"/><path d="M16 2v4"/><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M3 10h5"/><circle cx="16" cy="16" r="6"/><path d="M16 14v2l1 1"/>',
        refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
        shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
        gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
        fileSearch: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><circle cx="11.5" cy="14.5" r="2.5"/><path d="M13.3 16.3 15 18"/>',
        copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
        alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
        ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
        eyeOff: '<path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/>',
        diff: '<path d="M12 3v14"/><path d="M5 10h14"/><path d="M5 21h14"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
        mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
        upload: '<path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
        check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
        sparkles: '<path d="M9.94 14.06 8 20l-1.94-5.94L0 12l6.06-2.06L8 4l1.94 5.94L16 12z" transform="translate(4 0)"/><path d="M20 3v4"/><path d="M22 5h-4"/>',
        xCircle: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
        file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
        folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
        smartphone: '<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
        key: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
        download: '<path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
        card: '<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>',
        receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
        life: '<circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/><circle cx="12" cy="12" r="4"/>',
        scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
        megaphone: '<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>'
      };
      const icon = (n) => '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + I[n] + '</svg>';

      /* Each row: [id, icon, tone, title, body, time, unread, target] */
      const DATA = {
        alerts: [
          ['a1', 'clock', 'warning', 'Home policy ends in 7 days', 'Austin home · Travelers', 'Today', 1, 'insights_upd.html?insight=home-expiry'],
          ['a2', 'shield', 'warning', 'Coverage gap detected', 'Downtown apartment · No personal liability found', 'Today', 1, 'insights_upd.html?insight=state-minimum'],
          ['a3', 'copy', 'warning', 'Overlapping coverage detected', 'Austin home · Downtown apartment', 'Yesterday', 1, 'insights_upd.html?insight=duplicate'],
          ['a4', 'alert', 'danger', 'New watch point found', 'Austin home · Water damage exclusion', '2d ago', 0],
          ['a5', 'scale', 'neutral', 'Quotes compared', 'Camry renewal vs. new quote · Comparison ready', '3d ago', 0]
        ],
        updates: [
          ['u1', 'sparkles', 'success', 'Insights generated', 'Austin home · Travelers', 'Today', 1, 'insights_upd.html'],
          ['u2', 'check', 'success', 'Upload completed', '3 documents added to Austin home', 'Today', 1],
          ['u3', 'xCircle', 'danger', 'Upload failed', 'Camry_policy.pdf couldn’t be read. Try again.', 'Yesterday', 0],
          ['u4', 'sparkles', 'success', 'Insights generated', '2018 Toyota Camry · State Farm', '3d ago', 0]
        ]
      };

      const read = new Set();
      try { JSON.parse(sessionStorage.getItem('ovieNotifRead') || '[]').forEach((id) => read.add(id)); } catch (e) {}
      const persist = () => { try { sessionStorage.setItem('ovieNotifRead', JSON.stringify([...read])); } catch (e) {} };

      const panel = document.querySelector('#panel');
      const toast = document.querySelector('#toast');
      let current = 'alerts';
      let toastTimer;

      const showToast = (msg) => {
        toast.textContent = msg;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2400);
      };
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const unreadIn = (tab) => tab !== 'alerts' ? 0 : DATA[tab].filter((r) => r[6] && !read.has(r[0])).length;

      function render() {
        document.querySelector('#count-alerts').textContent = unreadIn('alerts');
        panel.setAttribute('aria-labelledby', 'tab-' + current);
        panel.innerHTML = '<section class="card" aria-label="' + (current === 'alerts' ? 'Alerts' : 'Updates') + '">' + DATA[current].map((r) => {
          const unread = current === 'alerts' && r[6] && !read.has(r[0]);
          return '<button class="row tone-' + r[2] + (unread ? ' unread' : '') + '" type="button" data-id="' + r[0] + '"' + (r[7] ? ' data-href="' + r[7] + '"' : '') + '>' +
            '<span class="row-icon" aria-hidden="true">' + icon(r[1]) + '</span>' +
            '<span class="row-copy"><span class="row-title">' + esc(r[3]) + (unread ? '<span class="visually-hidden"> (unread)</span>' : '') + '</span><span class="row-body">' + esc(r[4]) + '</span></span>' +
            '<span class="row-side">' + (current === 'alerts' ? '<span class="unread-dot" aria-hidden="true"></span>' : '<span></span>') + '<span class="row-time">' + esc(r[5]) + '</span></span></button>';
        }).join('') + '</section>';
      }


      panel.addEventListener('click', (e) => {
        const row = e.target.closest('.row');
        if (!row) return;
        read.add(row.dataset.id);
        persist();
        if (row.dataset.href) { location.href = row.dataset.href; return; }
        const title = row.querySelector('.row-title').firstChild.textContent;
        render();
        showToast('Opening ' + title);
        const next = panel.querySelector('[data-id="' + row.dataset.id + '"]');
        if (next) next.focus();
      });


      const tabs = Array.from(document.querySelectorAll('.tab'));
      function selectTab(tab, focus) {
        current = tab.dataset.tab;
        tabs.forEach((t) => { const on = t === tab; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
        render();
        if (focus) tab.focus();
      }
      tabs.forEach((tab) => {
        tab.addEventListener('click', () => selectTab(tab, false));
        tab.addEventListener('keydown', (e) => {
          const i = tabs.indexOf(tab);
          const move = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
          if (move === undefined) return;
          e.preventDefault();
          selectTab(tabs[(move + tabs.length) % tabs.length], true);
        });
      });

      document.querySelector('#backButton').addEventListener('click', () => {
        if (history.length > 1 && document.referrer) history.back(); else location.href = 'index.html';
      });

      const startTab = new URLSearchParams(location.search).get('tab');
      selectTab(tabs.find((t) => t.dataset.tab === startTab) || tabs[0], false);
    })();
  </script>
</body>
</html>
