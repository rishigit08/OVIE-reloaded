<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>My Profile | Ovie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b4062;
      --primary-dark: #54324d;
      --primary-soft: #f5edf3;
      --ink: #111111;
      --copy: #333a3d;
      --muted: #5f6368;
      --surface: #ffffff;
      --bg-canvas: #f6f6f6;
      --bg-subtle: #f6f6f6;
      --bg-control: #e3e3e3;
      --border: #d8dddb;
      --border-soft: #ecefed;
      --success: #0d7d07;
      --warning: #8a5a06;
      --danger: #a63a33;
      --focus: #6b4062;
      --radius: 12px;
      --motion-duration-press: 160ms;
      --motion-duration-standard: 200ms;
      --motion-ease-out: cubic-bezier(.23, 1, .32, 1);
      --nav-height: 72px;
      --z-sticky: 100;
      --z-toast: 900;
      --disabled-bg: #e8dee5;
      --disabled-text: #795972;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg-canvas);
      color: var(--ink);
      font-family: Figtree, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    :where(button, input, select, summary):focus-visible {
      outline: 0;
      box-shadow: 0 0 0 3px rgba(107, 64, 98, .24);
      border-color: var(--primary);
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 481px) {
      .app-shell { border-inline: 1px solid #d2d2d2; }
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
      background: rgba(255, 255, 255, .97);
      border-bottom: 1px solid var(--border-soft);
    }

    .titlebar {
      height: 58px;
      padding: 4px 12px 10px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .titlebar h1 { font-size: 18px; line-height: 24px; font-weight: 600; margin: 0; }

    .icon-button {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      display: grid;
      place-items: center;
      transition: background-color var(--motion-duration-press) var(--motion-ease-out);
    }

    .icon-button svg { width: 22px; height: 22px; }

    @media (hover: hover) and (pointer: fine) {
      .icon-button:hover { background: var(--bg-subtle); }
    }

    main {
      flex: 1;
      padding: 18px 16px calc(32px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-pad { padding: 16px; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    .avatar-field {
      margin-bottom: 20px;
    }

    .avatar-wrap {
      position: relative;
      width: 72px;
    }

    .avatar-preview {
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      border-radius: var(--radius);
      background: var(--primary-soft) center / cover no-repeat;
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 600;
    }

    .avatar-preview.has-photo { color: transparent; }

    .avatar-upload-button {
      position: absolute;
      right: -6px;
      bottom: -6px;
      width: 28px;
      height: 28px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .avatar-upload-button svg { width: 14px; height: 14px; }

    @media (hover: hover) and (pointer: fine) {
      .avatar-upload-button:hover { background: var(--primary-dark); }
    }

    label {
      color: var(--muted);
      font-weight: 500;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      transition: border-color var(--motion-duration-standard) var(--motion-ease-out);
    }

    input::placeholder { color: var(--muted); }

    input:focus-visible { border-color: var(--primary); }

    input:disabled {
      background: var(--bg-subtle);
      color: var(--muted);
      border-color: var(--border-soft);
      cursor: default;
    }

    input[type="date"] { color: var(--muted); }
    input[type="date"].has-value { color: var(--ink); }

    select {
      width: 100%;
      min-height: 44px;
      padding: 10px 40px 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%235f6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>') no-repeat right 12px center;
      background-size: 18px;
      color: var(--ink);
      font: inherit;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color var(--motion-duration-standard) var(--motion-ease-out);
    }

    select:invalid { color: var(--muted); }

    select:focus-visible { border-color: var(--primary); }

    select:disabled {
      background-color: var(--bg-subtle);
      color: var(--muted);
      border-color: var(--border-soft);
      cursor: default;
      background-image: none;
    }

    .input-icon-field {
      position: relative;
    }

    .input-icon-field input {
      padding-left: 40px;
    }

    .input-icon-field svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--muted);
      pointer-events: none;
    }

    .input-icon-field.trailing input {
      padding-left: 12px;
      padding-right: 40px;
    }

    .input-icon-field.trailing svg {
      left: auto;
      right: 12px;
    }

    .input-icon-field input[type="date"]::-webkit-calendar-picker-indicator {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .save-bar {
      position: sticky;
      bottom: 0;
      padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(246, 246, 246, 0) 0%, var(--bg-canvas) 40%);
    }

    .primary-action {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      transition: background-color var(--motion-duration-standard) var(--motion-ease-out), transform var(--motion-duration-press) var(--motion-ease-out);
    }

    .primary-action:active { transform: scale(.98); }

    @media (hover: hover) and (pointer: fine) {
      .primary-action:hover { background: var(--primary-dark); }
    }

    .toast {
      position: fixed;
      z-index: var(--z-toast);
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      width: min(calc(100% - 32px), 448px);
      padding: 12px 14px;
      transform: translate(-50%, 16px);
      border-radius: 10px;
      background: var(--ink);
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms var(--motion-ease-out), transform 180ms var(--motion-ease-out);
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
      .toast, .toast.show { transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="titlebar">
        <button class="icon-button" id="backButton" type="button" aria-label="Back to home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
        </button>
        <h1>My Profile</h1>
      </div>
    </header>

    <main>
      <form id="profileForm" novalidate>
        <div class="card">
          <div class="card-pad">
            <div class="avatar-field">
              <div class="avatar-wrap">
                <span class="avatar-preview" id="avatarPreview" aria-hidden="true">RV</span>
                <label class="avatar-upload-button" for="avatarInput">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
                    <path d="m15 5 4 4" />
                  </svg>
                  <span class="sr-only">Upload photo</span>
                </label>
                <input type="file" id="avatarInput" accept="image/*" class="sr-only">
              </div>
            </div>

            <div class="field">
              <label for="firstName">First name</label>
              <input type="text" id="firstName" name="firstName" autocomplete="given-name" placeholder="First name">
            </div>

            <div class="field">
              <label for="lastName">Last name</label>
              <input type="text" id="lastName" name="lastName" autocomplete="family-name" placeholder="Last name">
            </div>

            <div class="field">
              <label for="dob">Date of birth</label>
              <div class="input-icon-field trailing">
                <input type="date" id="dob" name="dob" autocomplete="bday">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M8 2v4" />
                  <path d="M16 2v4" />
                  <rect width="18" height="18" x="3" y="4" rx="2" />
                  <path d="M3 10h18" />
                </svg>
              </div>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com">
            </div>

            <div class="field">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="(555) 555-0100">
            </div>

            <div class="field">
              <label for="state">State</label>
              <div class="input-icon-field trailing">
                <input type="text" id="state" name="state" autocomplete="address-level1" placeholder="e.g. California">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
              </div>
            </div>

            <div class="field">
              <label for="country">Country</label>
              <select id="country" name="country" autocomplete="country-name" required>
                <option value="" disabled hidden>Select your country</option>
              </select>
            </div>
          </div>
        </div>

        <div class="save-bar">
          <button class="primary-action" type="submit">Save changes</button>
        </div>
      </form>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      // Prototype-only seed data. First/Last/DOB always come editable;
      // Email is present (locked) to simulate a value captured at signup.
      // Phone, State and Country are empty so the user can fill them in here.
      const profile = {
        firstName: 'Rishi',
        lastName: 'Verma',
        dob: '',
        email: 'rishi.verma@example.com',
        phone: '',
        state: '',
        country: ''
      };

      const COUNTRIES = [
        'United States', 'Canada', 'Mexico', 'United Kingdom', 'Ireland', 'France', 'Germany',
        'Spain', 'Italy', 'Portugal', 'Netherlands', 'Belgium', 'Switzerland', 'Austria',
        'Sweden', 'Norway', 'Denmark', 'Finland', 'Iceland', 'Poland', 'Czech Republic',
        'Greece', 'Australia', 'New Zealand', 'Japan', 'South Korea', 'China', 'India',
        'Singapore', 'Philippines', 'Indonesia', 'Malaysia', 'Thailand', 'Vietnam',
        'United Arab Emirates', 'Saudi Arabia', 'Israel', 'South Africa', 'Nigeria', 'Kenya',
        'Egypt', 'Brazil', 'Argentina', 'Chile', 'Colombia', 'Peru'
      ];

      const form = document.querySelector('#profileForm');
      const toast = document.querySelector('#toast');
      const backButton = document.querySelector('#backButton');
      let toastTimer;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove('show'), 2600);
      }

      function applyLockable(inputId, value) {
        const input = document.querySelector(`#${inputId}`);
        input.value = value;
        input.disabled = Boolean(value);
      }

      function initials(first, last) {
        return `${(first[0] || '').toUpperCase()}${(last[0] || '').toUpperCase()}` || 'OV';
      }

      const avatarInput = document.querySelector('#avatarInput');
      const avatarPreview = document.querySelector('#avatarPreview');
      avatarPreview.textContent = initials(profile.firstName, profile.lastName);
      avatarInput.addEventListener('change', () => {
        const file = avatarInput.files && avatarInput.files[0];
        if (!file) return;
        const objectUrl = URL.createObjectURL(file);
        avatarPreview.style.backgroundImage = `url(${objectUrl})`;
        avatarPreview.classList.add('has-photo');
      });

      // Always-editable fields.
      document.querySelector('#firstName').value = profile.firstName;
      document.querySelector('#lastName').value = profile.lastName;

      const dobInput = document.querySelector('#dob');
      dobInput.value = profile.dob;
      dobInput.classList.toggle('has-value', Boolean(dobInput.value));
      dobInput.addEventListener('input', () => {
        dobInput.classList.toggle('has-value', Boolean(dobInput.value));
      });

      // Locked-if-present fields.
      applyLockable('email', profile.email);
      applyLockable('phone', profile.phone);

      function populateSelect(select, values) {
        values.forEach((value) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.append(option);
        });
      }

      const stateInput = document.querySelector('#state');
      stateInput.value = profile.state;

      const countrySelect = document.querySelector('#country');
      populateSelect(countrySelect, COUNTRIES);
      countrySelect.value = profile.country;

      stateInput.disabled = Boolean(profile.state);
      countrySelect.disabled = Boolean(profile.country);

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        showToast('Profile saved');
      });

      backButton.addEventListener('click', () => {
        window.location.href = 'ovie_homepage.html';
      });
    })();
  </script>
</body>
</html>
