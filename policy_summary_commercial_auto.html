.vc{flex:none;width:164px;scroll-snap-align:start;text-align:left;background:#FBF9FC;border:1px solid #fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px rgba(107,64,98,.04),0 4px 16px rgba(107,64,98,.06);cursor:pointer;align-items:flex-start}

.tb.on{background:#F5EDF3;color:#6B4062;border-bottom-color:#6B4062}

/* ---- prototype shell + DESIGN.md token overrides ---- */
:root{--text:#111111;--text2:#333A3D;--text3:#5F6368;--icon-brand:#6B4062;--ok:#0D7D07;--warn:#8A5A06;--danger:#A63A33;--canvas:#F6F6F6;--bsub:#ECEFED;--bdef:#D8DDDB;--overlay:rgba(17,24,23,.58)}
html,body{height:100%}
body{background:#E3E3E3;display:flex;justify-content:center;align-items:center;min-height:100vh}
.ph{height:100vh;max-height:844px;background:var(--canvas)!important;overflow:hidden}
@media(min-width:500px){.ph{height:844px;border-radius:28px;box-shadow:0 6px 16px rgba(17,17,17,.12)}}
.scr{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.on{display:flex}
.nav{position:sticky;top:0;z-index:5;background:var(--canvas)}
.nav button,.ib{cursor:pointer}
.nav .ttl{font-size:18px;line-height:24px;font-weight:600}
.body{padding:12px 16px 190px}
button{cursor:pointer}
.dock{z-index:8}
.dockin input{flex:1;border:0;outline:0;background:transparent;font:400 14px/20px Figtree,system-ui;min-width:0;color:#5F6368}
.dockin input::placeholder{color:var(--text3)}
.qc:hover,.jump:hover{filter:brightness(.97)}
.fx:hover,.ir:hover{background:rgba(107,64,98,.04)}
/* color tokens */
.jb.g{color:var(--ok)}.jb.g .ms{text-shadow:0 2px 10px rgba(13,125,7,.55)}
.jb.r{color:var(--danger)}.jb.r .ms{text-shadow:0 2px 10px rgba(166,58,51,.55)}
.ir.ok::before{color:var(--ok);text-shadow:0 2px 10px rgba(13,125,7,.55)}
.status{background:#FFEDED;color:var(--danger)}.status i{background:var(--danger)}
.qm.r{color:var(--danger);text-shadow:0 2px 10px rgba(166,58,51,.55)}
.qm.w{color:var(--warn);text-shadow:0 2px 10px rgba(138,90,6,.55)}
.ir.nx,.ir.wx,.ir.dx{position:relative;padding-left:36px}
.ir.dx::before{content:"payments";color:#EAB308;text-shadow:0 2px 10px rgba(234,179,8,.55)}
.ir.nx::before,.ir.wx::before,.ir.dx::before{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 20;font-size:24px;line-height:24px;position:absolute;left:0;top:10px;width:24px;text-align:center;font-weight:normal;font-style:normal;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.ir.nx::before{content:"cancel";color:var(--danger);text-shadow:0 2px 10px rgba(166,58,51,.55)}
.ir.wx::before{content:"warning";color:var(--warn);text-shadow:0 2px 10px rgba(138,90,6,.55)}
.ir .sum.full{-webkit-line-clamp:unset;display:block}
.ir{text-align:left;color:inherit}
.fx{color:inherit}
/* sheets (DESIGN.md §10: 12px top corners, overlay shadow, 58% scrim) */
.scrim{position:absolute;inset:0;background:var(--overlay);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#fff;border-radius:12px 12px 0 0;z-index:21;transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);padding:8px 16px 24px;box-shadow:0 6px 16px rgba(17,17,17,.12)}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--bdef);margin:0 auto 6px}
.sht{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:8px}
.sht b{font-size:18px;line-height:24px;font-weight:600}
.sht button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:12px;margin-right:-10px}
.gbox{background:#F5EDF3;border-radius:12px;padding:4px 16px;margin-bottom:12px}
.gbox .kv{padding:10px 0;border-top:1px solid rgba(107,64,98,.18)}.gbox .kv:first-child{border-top:0}
.gbox.pad{padding:16px}
.lbl{font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#72777C;margin:16px 0 8px}
.srow{display:flex;justify-content:space-between;font-size:14px;line-height:20px;padding:8px 0;color:var(--text3)}
.srow+.srow{border-top:1px solid var(--bsub)}
.srow u{color:#6B4062;font-weight:600}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;margin-top:12px;border:1px solid #6B4062;background:transparent;color:#6B4062;border-radius:12px;font-weight:600;font-size:14px}
.cta:hover{background:#F5EDF3}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:12px 0 4px}
.sbar i{display:block}
.note.na{font-style:normal}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:86%;padding:12px 14px;font-size:14px;line-height:20px}
.bub.u{align-self:flex-end;background:#6B4062;color:#fff;border-radius:16px 16px 4px 16px}
.bub.a{align-self:flex-start;background:#FBF9FC;border:1px solid #fff;box-shadow:0 1px 2px rgba(107,64,98,.04),0 4px 16px rgba(107,64,98,.06);border-radius:16px 16px 16px 4px}
.bub small{display:block;margin-top:8px;font-size:12px;line-height:16px;color:var(--text3)}
.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.hid{display:none!important}
.fbk{display:flex;flex-direction:column;gap:16px}
.fbr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--text3)}
.fbb{display:flex;gap:4px;margin-right:-10px}
.tbn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:#5F6368}
.tbn:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(107,64,98,.24)}
.tbn.up{color:#0D7D07}.tbn.down{color:#A63A33}
.disc{margin:0;padding:0 16px;font-size:11px;line-height:16px;color:#5F6368}


/* DESIGN.md §7 top bar: 44x44 utility actions, 12px radius, background-subtle, icon-default, primary-soft hover, .96 press, plum focus ring */
.tbu{width:44px;height:44px;border:0;border-radius:12px;background:#F6F6F6;color:#5F6368;display:grid;place-items:center;cursor:pointer;transition:background-color .18s ease,transform .12s ease}
.tbu:hover{background:#F5EDF3}
.tbu:active{transform:scale(.96)}
.tbu:focus-visible,.nav button:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(107,64,98,.24)}
.nav button[aria-label=Back]{color:#111}
/* DESIGN.md §motion: top bar slides out on deliberate downward scroll, returns on upward scroll */
:root{--motion-duration-standard:200ms;--motion-ease-out:cubic-bezier(0.23,1,0.32,1)}

  wp:['Watchpoints',D.wpN,D.wp.map(irWp).join(''),`${D.wpN-D.wp.length} more watchpoint is counted on the policy but isn’t loaded in this prototype.`]}[k];
 $('#s-all').innerHTML=`<div class="nav" style="padding:0 8px;gap:4px"><button aria-label="Back" ${NAVBTN} onclick="go('main')">${BACK}</button><span class="ttl">${c[0]}</span></div>
 <div class="body"><div class="sx"><div class="card rows">${c[2]}</div>${c[3]?`<div class="note" style="padding:4px 4px 0">${c[3]}</div>`:''}</div></div>`;
 go('all');$('#s-all').scrollTop=0;
}

const A={
 liab:['Covered Autos Liability pays bodily injury and property damage losses when using any auto (owned, hired, non-owned, borrowed), up to $1,000,000 each accident (Symbol 1: Any auto). Uninsured and Underinsured Motorists are also $1,000,000 each accident, owned autos only.','Business Auto Declarations p.112'],
 exc:['Not included:<br>'+li(D.exc.map(e=>`${e[0]}: ${e[1]}`)),'See policy form for exhaustive list.'],
 ded:['Deductibles:<br>'+li(D.ded.map(d=>`${d.t}: ${d.v} ${d.sub} (${d.sc})`)),''],
 drv:['A covered driver schedule wasn’t provided in the supplied files. No named or scheduled drivers are shown, and no driver-restriction endorsements are referenced or attached.','All CPO-0632562-02 commercial auto declarations, schedules, endorsements'],
 wp:['Things to watch:<br>'+li(D.wp.map(w=>`${w[0]}: ${w[1]}`)),''],
 premium:['Commercial auto premium is $3,013.00 per policy year. Terrorism is $287.00, taxes & surcharges $163.31 and the data fee $250.00. Total policy premium across all lines is $18,597.31. There are no vehicle-level premiums; it is policy-level only.','Business Auto Declarations p.112; Common Policy Declarations p.1, p.94'],

 vehicles:['Seven units are scheduled: '+D.vehicles.map(v=>v.t).join(', ')+'. Full detail is loaded for the 2012 Ford F250 (VIN 1FT7X2B68CEA12959, cost new $35,000, $500 comp and collision deductibles).','Auto Schedule p.121'],
 miss:['Not provided: '+D.miss.map(m=>m[0]).join('; ')+'.',''],
 pip:['Personal Injury Protection pays no-fault losses as per KY requirements for covered vehicles (owned autos subject to no-fault). The limit is not stated.',''],
 um:['Uninsured Motorists covers you if injured by a driver with no insurance, using owned autos, up to $1,000,000 each accident.',''],
 uim:['Underinsured Motorists covers you if injured by a driver with too little insurance, owned autos, up to $1,000,000 each accident.',''],
 comp:['Comprehensive pays for non-collision damages (theft, weather, fire, etc.) on scheduled and hired vehicles, at ACV or cost of repair minus a $500 deductible.','']
};
const LBL={premium:'Tell me about this premium',details:'Tell me about this policy',coll:'Tell me about collision',vehicles:'Tell me about the vehicles',miss:'What is missing?',pip:'Tell me about PIP',um:'Tell me about uninsured motorists',uim:'Tell me about underinsured motorists',comp:'Tell me about comprehensive',liab:'What does my liability cover?',exc:'What isn’t covered?',ded:'What are my deductibles?',drv:'Why are drivers missing?',wp:'What should I watch for?'};
const QUICK=['liab','exc','ded','drv','wp'];
let msgs=[];
function chatView(){
 $('#s-chat').innerHTML=`<div class="nav" style="padding:0 8px;gap:4px"><button aria-label="Back" ${NAVBTN} onclick="go('main')">${BACK}</button><span class="ttl">Ask Mosey</span></div>
 <div class="body" style="padding-bottom:170px"><div class="chat">${msgs.map(m=>m.u?`<div class="bub u">${m.t}</div>`:`<div class="bub a">${m.t}${m.s?`<small>Source: ${m.s}</small>`:''}</div>`).join('')}</div></div>
`;
 go('chat');const s=$('#s-chat');s.scrollTop=s.scrollHeight;
}
function ask(k){const a=A[k];msgs.push({u:1,t:LBL[k]});msgs.push({t:a[0],s:a[1]});chatView()}
function match(q){q=q.toLowerCase();
 for(const [re,k] of [[/liab/,'liab'],[/not covered|exclu|isn.?t covered|not included/,'exc'],[/deduct/,'ded'],[/driver/,'drv'],[/watch|risk|careful/,'wp'],[/premium|cost|price/,'premium'],[/detail|broker|address|period|date/,'details'],[/collision/,'coll'],[/comprehensive/,'comp'],[/uninsured/,'um'],[/underinsured/,'uim'],[/pip|no-fault|injury protection/,'pip'],[/vehicle|truck|trailer|\bcar\b/,'vehicles'],[/missing|not provided/,'miss']])if(re.test(q))return k;return null}
function sendTxt(id){const el=$('#'+id);const v=el.value.trim();if(!v)return;el.value='';const k=match(v);
 msgs.push({u:1,t:v.replace(/</g,'&lt;')});msgs.push(k?{t:A[k][0],s:A[k][1]}:{t:'This is a prototype, so I can only answer from the loaded policy data. Try one of the suggested questions.'});chatView();}
$('#qchips').innerHTML=QUICK.map(k=>`<button class="qc" onclick="ask('${k}')">${LBL[k]}</button>`).join('');
$('#dmic').innerHTML=MIC;
$('#dadd').onclick=()=>toast('Attachments aren’t part of this prototype');
$('#dmic').onclick=()=>{$('#dinp').value.trim()?(sendTxt('dinp')):toast('Voice input isn’t part of this prototype')};
$('#dinp').onkeydown=e=>{if(e.key=='Enter')sendTxt('dinp')};
$('#dinp').oninput=e=>{$('#dmic').innerHTML=e.target.value?SEND:MIC};
/* hide top bar after deliberate downward scroll; show on any upward scroll, near the top, or while a header control has focus */
document.querySelectorAll('.scr').forEach(s=>{let last=0,down=0;
 s.addEventListener('scroll',()=>{const t=s.scrollTop,d=t-last;last=t;
  if(t<=56){down=0;s.classList.remove('nh');return}
  if(d>0){down+=d;if(down>24&&!s.contains(document.activeElement.closest('.nav')))s.classList.add('nh')}
  else if(d<-1){down=0;s.classList.remove('nh')}},{passive:true});
 s.addEventListener('focusin',e=>{if(e.target.closest('.nav'))s.classList.remove('nh')})});
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
renderMain();
